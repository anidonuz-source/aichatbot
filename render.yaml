services:
  - type: worker
    name: jarvis-telegram-bot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: MEMORY_DIR
        value: /data/memory
    disk:
      name: jarvis-memory
      mountPath: /data
      sizeGB: 1
