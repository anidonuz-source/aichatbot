<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misumi AI · Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0b0d;
    --ink-2:#141417;
    --panel:#1b1b1f;
    --panel-2:#202024;
    --hairline:rgba(201,162,39,0.16);
    --hairline-strong:rgba(201,162,39,0.3);
    --brass:#c9a227;
    --brass-soft:#8a7228;
    --brass-dim:rgba(201,162,39,0.1);
    --plum:#3b2f4a;
    --plum-soft:#7d6a94;
    --plum-dim:rgba(123,106,148,0.14);
    --paper:#f2efe9;
    --paper-dim:#a9a6a0;
    --danger:#c9524a;
    --danger-dim:rgba(201,82,74,0.12);
    --success:#5c9c74;
    --success-dim:rgba(92,156,116,0.14);
    --overlay:rgba(6,6,7,0.6);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(201,162,39,0.07), transparent 60%),
      var(--ink);
    color:var(--paper);
    font-family:'Manrope',sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  ::selection{background:var(--brass-dim); color:var(--paper);}

  @keyframes rise{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  @keyframes shimmer{ 0%{background-position:-200% 0;} 100%{background-position:200% 0;} }
  @keyframes toastIn{ from{opacity:0; transform:translate(-50%, 8px);} to{opacity:1; transform:translate(-50%, 0);} }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  header{
    flex:0 0 auto;
    padding:calc(18px + var(--safe-top)) 20px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--hairline);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    position:sticky; top:0; z-index:5;
    backdrop-filter:blur(10px);
  }
  .mark{width:28px;height:28px;flex:0 0 auto;}
  .mark svg{width:100%;height:100%;display:block;}
  .titles{display:flex;flex-direction:column;line-height:1.15;}
  .titles .name{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:21px;
    letter-spacing:0.02em;
    color:var(--paper);
  }
  .titles .sub{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--brass-soft);
    margin-top:2px;
  }
  .live-dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--success);
    box-shadow:0 0 0 2px var(--success-dim);
    animation:pulse 2.2s ease-in-out infinite;
  }
  .header-actions{margin-left:auto; display:flex; gap:8px;}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--hairline);
    background:rgba(255,255,255,0.02);
    display:flex;align-items:center;justify-content:center;
    color:var(--paper-dim);
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease, transform .2s ease;
  }
  .icon-btn svg{width:15px;height:15px;}
  .icon-btn:active{transform:scale(0.92);}
  .icon-btn:hover{border-color:var(--brass); color:var(--brass);}
  .icon-btn.spinning svg{animation:spin .7s linear infinite;}

  main{flex:1 1 auto; padding:18px 16px calc(28px + var(--safe-bottom)); overflow-y:auto;}
  .container{max-width:560px; margin:0 auto;}

  #gate{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:10px; padding:60px 24px;
  }
  #gate .gate-icon{
    width:56px;height:56px; border-radius:50%;
    background:var(--danger-dim); border:1px solid rgba(201,82,74,0.35);
    display:flex; align-items:center; justify-content:center;
    color:var(--danger); margin-bottom:6px;
  }
  #gate .gate-icon svg{width:24px;height:24px;}
  #gate h2{font-family:'Cormorant Garamond',serif; font-size:22px; margin:0; color:var(--paper);}
  #gate p{font-size:13px; color:var(--paper-dim); max-width:280px; line-height:1.6; margin:0;}

  /* ---------- Loading skeleton ---------- */
  #loading{display:none;}
  #loading.container{padding-top:4px;}
  .skel{
    background:linear-gradient(90deg, var(--panel) 25%, var(--panel-2) 37%, var(--panel) 63%);
    background-size:400% 100%;
    animation:shimmer 1.4s ease infinite;
    border-radius:14px;
    border:1px solid var(--hairline);
  }
  .skel-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .skel-stats .skel{height:84px;}
  .skel-panel{height:70px; margin-bottom:16px;}
  .skel-search{height:42px; margin-bottom:12px;}
  .skel-card{height:112px; margin-bottom:10px;}

  #dash{display:none;}

  .stats-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;
  }
  .stat-card{
    background:var(--panel); border:1px solid var(--hairline); border-radius:14px;
    padding:14px 16px;
    opacity:0; animation:rise .5s ease forwards;
    transition:border-color .2s ease, transform .2s ease;
  }
  .stat-card:hover{border-color:var(--hairline-strong); transform:translateY(-1px);}
  .stat-card .icon{
    width:28px;height:28px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:10px;
  }
  .stat-card .icon svg{width:14px;height:14px;}
  .stat-card.c-brass .icon{background:var(--brass-dim); color:var(--brass);}
  .stat-card.c-plum .icon{background:var(--plum-dim); color:var(--plum-soft);}
  .stat-card.c-success .icon{background:var(--success-dim); color:var(--success);}
  .stat-card.c-danger .icon{background:var(--danger-dim); color:var(--danger);}
  .stat-card .num{
    font-family:'Cormorant Garamond',serif; font-weight:600; font-size:27px; color:var(--paper);
    line-height:1.1;
  }
  .stat-card .label{
    font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.07em;
    text-transform:uppercase; color:var(--paper-dim); margin-top:5px;
  }

  .panel{
    background:var(--panel); border:1px solid var(--hairline); border-radius:14px;
    padding:14px 16px; margin-bottom:16px;
    opacity:0; animation:rise .5s ease forwards .05s;
  }
  .panel-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .panel-row .icon-wrap{
    width:34px;height:34px;border-radius:10px; flex:0 0 auto;
    background:var(--brass-dim); color:var(--brass);
    display:flex; align-items:center; justify-content:center; margin-right:2px;
  }
  .panel-row .icon-wrap svg{width:16px;height:16px;}
  .panel-row .txt{display:flex; align-items:center; flex:1 1 auto; min-width:0;}
  .panel-row .txt-inner .t{font-size:14px; font-weight:600; color:var(--paper);}
  .panel-row .txt-inner .d{font-size:12px; color:var(--paper-dim); margin-top:2px; line-height:1.4;}

  .switch{
    position:relative; width:44px; height:26px; flex:0 0 auto; cursor:pointer;
  }
  .switch input{display:none;}
  .switch .track{
    position:absolute; inset:0; border-radius:14px; background:rgba(255,255,255,0.08);
    border:1px solid var(--hairline); transition:background .2s ease, border-color .2s ease;
  }
  .switch .thumb{
    position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:var(--paper-dim); transition:transform .2s ease, background .2s ease;
  }
  .switch input:checked + .track{background:rgba(201,82,74,0.25); border-color:var(--danger);}
  .switch input:checked + .track + .thumb{transform:translateX(18px); background:var(--danger);}

  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:20px 2px 10px;
  }
  .section-title{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.09em;
    text-transform:uppercase; color:var(--brass-soft);
  }
  .section-count{
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--paper-dim);
  }

  .search{
    width:100%; padding:10px 14px; border-radius:12px; border:1px solid var(--hairline);
    background:var(--ink-2); color:var(--paper); font-family:'Manrope',sans-serif;
    font-size:13.5px; outline:none; margin-bottom:10px;
    transition:border-color .2s ease;
  }
  .search:focus{border-color:var(--hairline-strong);}
  .search::placeholder{color:var(--paper-dim);}

  .filter-tabs{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; scrollbar-width:none;}
  .filter-tabs::-webkit-scrollbar{display:none;}
  .filter-tab{
    flex:0 0 auto;
    padding:6px 13px; border-radius:20px; border:1px solid var(--hairline);
    background:transparent; color:var(--paper-dim);
    font-family:'Manrope',sans-serif; font-size:12px; font-weight:600;
    cursor:pointer; white-space:nowrap;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .filter-tab:active{transform:scale(0.96);}
  .filter-tab.active{
    background:var(--brass-dim); border-color:var(--hairline-strong); color:var(--brass);
  }

  .user-card{
    background:var(--panel); border:1px solid var(--hairline); border-radius:14px;
    padding:12px 14px; margin-bottom:10px;
    opacity:0; animation:rise .4s ease forwards;
    transition:border-color .2s ease;
  }
  .user-card:hover{border-color:var(--hairline-strong);}
  .user-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .user-id-row{display:flex; align-items:center; gap:10px; min-width:0;}
  .avatar{
    width:36px;height:36px;border-radius:11px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg, var(--plum), #2c2337);
    border:1px solid var(--hairline-strong);
    font-family:'Cormorant Garamond',serif; font-weight:600; font-size:16px;
    color:var(--paper);
  }
  .user-name-wrap{min-width:0;}
  .user-name{font-size:14px; font-weight:600; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .user-id{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--paper-dim); margin-top:2px;}
  .badges{display:flex; gap:6px; flex:0 0 auto;}
  .badge{
    font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:0.05em;
    text-transform:uppercase; padding:3px 7px; border-radius:20px; border:1px solid var(--hairline);
    color:var(--paper-dim); white-space:nowrap;
  }
  .badge.premium{color:var(--brass); border-color:rgba(201,162,39,0.4);}
  .badge.blocked{color:var(--danger); border-color:rgba(201,82,74,0.4);}

  .user-meta{
    display:flex; gap:14px; margin-top:10px; padding-top:10px;
    border-top:1px solid var(--hairline);
    font-size:11.5px; color:var(--paper-dim);
  }
  .user-meta span{display:flex; align-items:center; gap:5px;}
  .user-meta svg{width:12px;height:12px; flex:0 0 auto; opacity:0.7;}
  .user-meta .src-pill{
    margin-left:auto;
    font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.04em;
    color:var(--plum-soft); background:var(--plum-dim); padding:2px 8px; border-radius:10px;
  }

  .user-actions{display:flex; gap:8px; margin-top:10px;}
  .action-btn{
    flex:1; padding:8px 10px; border-radius:10px; border:1px solid var(--hairline);
    background:rgba(255,255,255,0.02); color:var(--paper-dim); font-size:12px;
    font-family:'Manrope',sans-serif; font-weight:600; cursor:pointer; text-align:center;
    transition:border-color .15s ease, color .15s ease, opacity .15s ease;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .action-btn svg{width:12px;height:12px;}
  .action-btn:active{transform:scale(0.97);}
  .action-btn.premium-on{color:var(--brass); border-color:rgba(201,162,39,0.4); background:var(--brass-dim);}
  .action-btn.block-on{color:var(--danger); border-color:rgba(201,82,74,0.4); background:var(--danger-dim);}
  .action-btn.loading{opacity:0.5; pointer-events:none;}

  .empty{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    text-align:center; color:var(--paper-dim); font-size:13px; padding:40px 10px;
  }
  .empty svg{width:26px;height:26px; opacity:0.5;}

  .toast{
    position:fixed; left:50%; bottom:calc(20px + var(--safe-bottom));
    transform:translateX(-50%);
    background:var(--panel-2); border:1px solid var(--hairline-strong);
    color:var(--paper); font-size:12.5px; font-weight:600;
    padding:10px 18px; border-radius:30px; z-index:30;
    display:flex; align-items:center; gap:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    animation:toastIn .25s ease forwards;
    white-space:nowrap;
  }
  .toast .dot{width:6px;height:6px;border-radius:50%; background:var(--success); flex:0 0 auto;}
  .toast.err .dot{background:var(--danger);}
</style>
</head>
<body>

<header>
  <div class="mark">
    <svg viewBox="0 0 30 30" fill="none">
      <circle cx="15" cy="6" r="2.4" fill="#c9a227"/>
      <circle cx="6" cy="22" r="2.4" fill="#c9a227"/>
      <circle cx="24" cy="22" r="2.4" fill="#c9a227"/>
    </svg>
  </div>
  <div class="titles">
    <div class="name">Misumi AI</div>
    <div class="sub"><span class="live-dot"></span>Admin panel</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="refreshBtn" title="Yangilash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="container">
    <div id="gate" style="display:none;">
      <div class="gate-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"></line></svg>
      </div>
      <h2>Ruxsat yo'q</h2>
      <p>Bu sahifa faqat botning administratori uchun. Agar bu xato deb hisoblasangiz, ADMIN_ID sozlamasini tekshiring.</p>
    </div>

    <div id="loading" class="container">
      <div class="skel-stats">
        <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
      </div>
      <div class="skel skel-panel"></div>
      <div class="skel skel-search"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
      <div class="skel skel-card"></div>
    </div>

    <div id="dash">
      <div class="stats-grid" id="statsGrid"></div>

      <div class="panel">
        <div class="panel-row">
          <div class="txt">
            <div class="icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
            </div>
            <div class="txt-inner">
              <div class="t">Texnik ishlar rejimi</div>
              <div class="d">Yoqilsa, faqat siz botdan foydalana olasiz — boshqalarga xabar ko'rsatiladi.</div>
            </div>
          </div>
          <label class="switch">
            <input type="checkbox" id="maintenanceToggle">
            <span class="track"></span>
            <span class="thumb"></span>
          </label>
        </div>
      </div>

      <div class="section-head">
        <div class="section-title">Foydalanuvchilar</div>
        <div class="section-count" id="sectionCount"></div>
      </div>
      <input class="search" id="searchInput" placeholder="Ism yoki ID bo'yicha qidirish…">
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-filter="all">Hammasi</button>
        <button class="filter-tab" data-filter="premium">Premium</button>
        <button class="filter-tab" data-filter="blocked">Bloklangan</button>
        <button class="filter-tab" data-filter="miniapp">Mini App</button>
      </div>
      <div id="usersList"></div>
    </div>
  </div>
</main>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = tg?.initData || '';

  const gateEl = document.getElementById('gate');
  const loadingEl = document.getElementById('loading');
  const dashEl = document.getElementById('dash');
  const statsGrid = document.getElementById('statsGrid');
  const maintenanceToggle = document.getElementById('maintenanceToggle');
  const usersList = document.getElementById('usersList');
  const searchInput = document.getElementById('searchInput');
  const sectionCount = document.getElementById('sectionCount');
  const filterTabs = document.getElementById('filterTabs');
  const refreshBtn = document.getElementById('refreshBtn');

  let allUsers = [];
  let currentFilter = 'all';

  const ICONS = {
    users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    messages: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
    blocked: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    starSm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
    shieldOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    empty: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'
  };

  async function api(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ initData, ...body })
    });
    if (res.status === 403 || res.status === 401) throw new Error('unauthorized');
    return res.json();
  }

  function showToast(msg, isErr) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'toast' + (isErr ? ' err' : '');
    t.innerHTML = `<span class="dot"></span><span></span>`;
    t.querySelector('span:last-child').textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2400);
  }

  function relativeTime(str) {
    if (!str) return '—';
    const then = new Date(str.replace(' ', 'T'));
    if (isNaN(then.getTime())) return str;
    const diffMs = Date.now() - then.getTime();
    const min = Math.floor(diffMs / 60000);
    if (min < 1) return 'hozirgina';
    if (min < 60) return `${min} daqiqa oldin`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr} soat oldin`;
    const day = Math.floor(hr / 24);
    if (day < 30) return `${day} kun oldin`;
    return then.toLocaleDateString('uz-UZ', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function initials(name) {
    if (!name) return '?';
    const parts = name.trim().split(/\s+/).slice(0, 2);
    return parts.map(p => p[0]?.toUpperCase() || '').join('') || name[0]?.toUpperCase() || '?';
  }

  function renderStats(stats) {
    const avg = stats.total_users ? (stats.total_messages / stats.total_users).toFixed(1) : '0';
    statsGrid.innerHTML = `
      <div class="stat-card c-brass" style="animation-delay:.02s">
        <div class="icon">${ICONS.users}</div>
        <div class="num">${stats.total_users}</div>
        <div class="label">Foydalanuvchilar</div>
      </div>
      <div class="stat-card c-plum" style="animation-delay:.06s">
        <div class="icon">${ICONS.messages}</div>
        <div class="num">${stats.total_messages}</div>
        <div class="label">Xabarlar · o'rt. ${avg}</div>
      </div>
      <div class="stat-card c-success" style="animation-delay:.1s">
        <div class="icon">${ICONS.star}</div>
        <div class="num">${stats.premium_count}</div>
        <div class="label">Premium</div>
      </div>
      <div class="stat-card c-danger" style="animation-delay:.14s">
        <div class="icon">${ICONS.blocked}</div>
        <div class="num">${stats.blocked_count}</div>
        <div class="label">Bloklangan</div>
      </div>
    `;
    maintenanceToggle.checked = !!stats.maintenance;
  }

  function renderUsers(users) {
    sectionCount.textContent = `${users.length} / ${allUsers.length}`;
    if (!allUsers.length) {
      usersList.innerHTML = `<div class="empty">${ICONS.empty}<div>Hozircha foydalanuvchilar yo'q.<br>Bot birinchi xabarni qabul qilgach, shu yerda paydo bo'ladi.</div></div>`;
      return;
    }
    if (!users.length) {
      usersList.innerHTML = `<div class="empty">${ICONS.empty}<div>Ushbu filtrga mos foydalanuvchi topilmadi.</div></div>`;
      return;
    }
    usersList.innerHTML = users.map((u, i) => `
      <div class="user-card" data-id="${u.id}" style="animation-delay:${Math.min(i * 0.03, 0.3)}s">
        <div class="user-top">
          <div class="user-id-row">
            <div class="avatar">${escapeHtml(initials(u.name))}</div>
            <div class="user-name-wrap">
              <div class="user-name">${escapeHtml(u.name)}</div>
              <div class="user-id">ID: ${u.id}</div>
            </div>
          </div>
          <div class="badges">
            ${u.premium ? '<span class="badge premium">Premium</span>' : ''}
            ${u.blocked ? '<span class="badge blocked">Bloklangan</span>' : ''}
          </div>
        </div>
        <div class="user-meta">
          <span>${ICONS.chat}${u.message_count} xabar</span>
          <span>${ICONS.clock}${relativeTime(u.last_seen)}</span>
          <span class="src-pill">${u.source === 'miniapp' ? 'Mini App' : 'Telegram'}</span>
        </div>
        <div class="user-actions">
          <button class="action-btn ${u.premium ? 'premium-on' : ''}" data-action="premium">${ICONS.starSm}${u.premium ? 'Premium faol' : 'Premium berish'}</button>
          <button class="action-btn ${u.blocked ? 'block-on' : ''}" data-action="block">${ICONS.shieldOff}${u.blocked ? 'Blokdan chiqarish' : 'Bloklash'}</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s ?? '';
    return d.innerHTML;
  }

  function applyFilter() {
    const q = searchInput.value.trim().toLowerCase();
    let list = allUsers;
    if (currentFilter === 'premium') list = list.filter(u => u.premium);
    else if (currentFilter === 'blocked') list = list.filter(u => u.blocked);
    else if (currentFilter === 'miniapp') list = list.filter(u => u.source === 'miniapp');
    if (q) list = list.filter(u => u.name.toLowerCase().includes(q) || u.id.includes(q));
    renderUsers(list);
  }

  searchInput.addEventListener('input', applyFilter);

  filterTabs.addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-tab');
    if (!btn) return;
    tg?.HapticFeedback?.selectionChanged();
    filterTabs.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilter();
  });

  usersList.addEventListener('click', async (e) => {
    const btn = e.target.closest('.action-btn');
    if (!btn) return;
    const card = e.target.closest('.user-card');
    const userId = card.dataset.id;
    const action = btn.dataset.action;
    tg?.HapticFeedback?.impactOccurred('light');
    btn.classList.add('loading');
    try {
      if (action === 'premium') {
        const r = await api('/api/admin/toggle-premium', { user_id: userId });
        const u = allUsers.find(x => x.id === userId);
        if (u) u.premium = r.premium;
        showToast(r.premium ? "Premium berildi" : "Premium bekor qilindi");
      } else if (action === 'block') {
        const r = await api('/api/admin/toggle-block', { user_id: userId });
        const u = allUsers.find(x => x.id === userId);
        if (u) u.blocked = r.blocked;
        showToast(r.blocked ? "Foydalanuvchi bloklandi" : "Blokdan chiqarildi", r.blocked);
      }
      const stats = await api('/api/admin/stats', {});
      renderStats(stats);
      applyFilter();
    } catch (err) {
      showToast("Xatolik yuz berdi", true);
    } finally {
      btn.classList.remove('loading');
    }
  });

  maintenanceToggle.addEventListener('change', async () => {
    tg?.HapticFeedback?.impactOccurred('medium');
    try {
      await api('/api/admin/maintenance', { value: maintenanceToggle.checked });
      showToast(maintenanceToggle.checked ? "Texnik ishlar rejimi yoqildi" : "Texnik ishlar rejimi o'chirildi", maintenanceToggle.checked);
    } catch (err) {
      maintenanceToggle.checked = !maintenanceToggle.checked;
      showToast("Xatolik yuz berdi", true);
    }
  });

  refreshBtn.addEventListener('click', () => {
    tg?.HapticFeedback?.impactOccurred('light');
    load(true);
  });

  async function load(isRefresh) {
    if (isRefresh) refreshBtn.classList.add('spinning');
    else {
      loadingEl.style.display = 'block';
      dashEl.style.display = 'none';
    }
    try {
      const [stats, usersRes] = await Promise.all([
        api('/api/admin/stats', {}),
        api('/api/admin/users', {})
      ]);
      allUsers = usersRes.users || [];
      renderStats(stats);
      applyFilter();
      loadingEl.style.display = 'none';
      dashEl.style.display = 'block';
      if (isRefresh) showToast("Yangilandi");
    } catch (err) {
      loadingEl.style.display = 'none';
      if (isRefresh) { showToast("Yangilab bo'lmadi", true); }
      else { gateEl.style.display = 'flex'; }
    } finally {
      refreshBtn.classList.remove('spinning');
    }
  }

  load(false);
</script>
</body>
</html>
