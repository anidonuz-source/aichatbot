<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Misumi AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0b0d;
    --ink-2:#141417;
    --panel:#1b1b1f;
    --panel-2:#202024;
    --hairline:rgba(201,162,39,0.16);
    --hairline-strong:rgba(201,162,39,0.3);
    --brass:#c9a227;
    --brass-soft:#8a7228;
    --brass-dim:rgba(201,162,39,0.1);
    --plum:#3b2f4a;
    --paper:#f2efe9;
    --paper-dim:#a9a6a0;
    --danger:#c9524a;
    --overlay:rgba(6,6,7,0.6);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  @supports (height: 100dvh){
    html,body{height:100dvh;}
  }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(201,162,39,0.07), transparent 60%),
      var(--ink);
    color:var(--paper);
    font-family:'Manrope',sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  :focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:2px;}
  textarea:focus-visible{outline:none;}

  /* ---------- App shell (desktop sidebar + centered chat column) ---------- */
  .app-shell{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    max-width:1320px;
    margin:0 auto;
    display:flex;
    flex-direction:row;
    position:relative;
  }
  .chat-shell{
    flex:1 1 auto;
    min-width:0;
    min-height:0;
    height:100%;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:880px){
    .scrim{display:none;}
    #menuBtn{display:none;}
    .drawer{
      position:static;
      transform:none;
      width:272px;
      flex:0 0 272px;
      height:100%;
      box-shadow:none;
    }
    header{padding-left:28px; padding-right:28px;}
    main{align-items:center; padding-left:32px; padding-right:32px;}
    .row{width:100%; max-width:720px;}
    .welcome{width:100%; max-width:520px;}
    footer{padding-left:32px; padding-right:32px;}
    .composer{max-width:720px; margin:0 auto;}
    .credit{max-width:720px; margin:0 auto;}
  }

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    position:relative;
    padding:calc(18px + var(--safe-top)) 20px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid var(--hairline);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .mark{
    width:30px;height:30px;flex:0 0 auto;position:relative;
  }
  .mark svg{width:100%;height:100%;display:block;}
  .mark .dot{fill:var(--brass);}
  .titles{display:flex;flex-direction:column;line-height:1.15;}
  .titles .name{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:0.02em;
    color:var(--paper);
  }
  .titles .sub{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--brass-soft);
    margin-top:2px;
  }
  /* ---------- Model picker ---------- */
  .model-picker{
    display:flex; align-items:center; gap:5px;
    border:none; background:transparent; cursor:pointer;
    padding:2px 0; margin-top:2px;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px; letter-spacing:0.06em;
    color:var(--brass-soft);
  }
  .model-picker:active{opacity:0.7;}
  .model-picker svg{width:9px;height:9px; flex:0 0 auto; transition:transform .18s ease;}
  .model-picker.open svg{transform:rotate(180deg);}
  .model-menu{
    position:absolute;
    top:calc(100% + 8px); left:20px;
    width:min(280px, calc(100vw - 40px));
    background:var(--panel-2);
    border:1px solid var(--hairline-strong);
    border-radius:14px;
    padding:6px;
    box-shadow:0 12px 30px rgba(0,0,0,0.35);
    z-index:22;
    opacity:0; pointer-events:none; transform:translateY(-6px);
    transition:opacity .18s ease, transform .18s ease;
  }
  .model-menu.open{opacity:1; pointer-events:auto; transform:translateY(0);}
  .model-option{
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 10px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .model-option:hover{background:rgba(255,255,255,0.04);}
  .model-option.active{background:var(--brass-dim);}
  .model-option.locked{cursor:pointer;}
  .model-option .model-dot{
    width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:5px;
    background:var(--paper-dim);
  }
  .model-option.active .model-dot{background:var(--brass);}
  .model-option .model-text{flex:1 1 auto; min-width:0;}
  .model-option .model-label{
    display:flex; align-items:center; gap:6px;
    font-family:'Manrope',sans-serif; font-size:13.5px; font-weight:700;
    color:var(--paper);
  }
  .model-option .model-tag{
    font-size:11.5px; color:var(--paper-dim); margin-top:2px; line-height:1.35;
  }
  .model-option .lock-badge{
    display:flex; align-items:center; gap:3px;
    font-family:'JetBrains Mono',monospace;
    font-size:9px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--brass);
    background:var(--brass-dim);
    border:1px solid var(--hairline-strong);
    border-radius:20px;
    padding:2px 7px;
    flex:0 0 auto;
  }
  .lock-badge svg{width:8px;height:8px;}
  .model-menu-foot{
    padding:9px 10px 4px;
    font-size:10.5px; color:var(--paper-dim); line-height:1.5;
    border-top:1px solid var(--hairline);
    margin-top:4px;
  }
  .model-menu-foot a{color:var(--brass-soft); text-decoration:none;}

  .header-actions{margin-left:auto;display:flex;gap:8px;}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--hairline);
    background:rgba(255,255,255,0.02);
    display:flex;align-items:center;justify-content:center;
    color:var(--paper-dim);
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn:hover{border-color:var(--brass); color:var(--brass);}

  /* ---------- Sessions drawer ---------- */
  .scrim{
    position:fixed; inset:0;
    background:var(--overlay);
    backdrop-filter:blur(2px);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:20;
  }
  .scrim.open{opacity:1; pointer-events:auto;}

  .drawer{
    position:fixed; top:0; left:0; bottom:0;
    width:min(82vw, 300px);
    background:var(--panel);
    border-right:1px solid var(--hairline);
    transform:translateX(-100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    z-index:21;
    display:flex; flex-direction:column;
    padding-top:var(--safe-top);
  }
  .drawer.open{transform:translateX(0);}
  .drawer-head{
    padding:20px 16px 14px;
    border-bottom:1px solid var(--hairline);
    flex:0 0 auto;
  }
  .drawer-head .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--brass-soft); margin-bottom:12px;
  }
  .new-chat-btn{
    width:100%;
    display:flex; align-items:center; gap:9px;
    padding:10px 13px;
    border-radius:12px;
    border:1px solid var(--hairline-strong);
    background:var(--brass-dim);
    color:var(--brass);
    font-family:'Manrope',sans-serif;
    font-size:13.5px; font-weight:600;
    cursor:pointer;
  }
  .new-chat-btn:active{transform:scale(0.98);}
  .new-chat-btn svg{width:15px;height:15px; flex:0 0 auto;}

  .session-list{
    flex:1 1 auto; overflow-y:auto;
    padding:10px 10px 10px;
  }
  .session-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 10px;
    border-radius:11px;
    cursor:pointer;
    color:var(--paper-dim);
    position:relative;
    margin-bottom:2px;
  }
  .session-item .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--paper-dim); flex:0 0 auto;
  }
  .session-item .label{
    flex:1 1 auto; min-width:0;
    font-size:13px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .session-item .del{
    flex:0 0 auto; opacity:0;
    width:22px;height:22px; border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--paper-dim);
    transition:opacity .15s ease, color .15s ease;
  }
  .session-item:hover .del{opacity:1;}
  .session-item .del:hover{color:var(--danger);}
  .session-item .del svg{width:11px;height:11px;}
  .session-item:hover{background:rgba(255,255,255,0.03); color:var(--paper);}
  .session-item.active{background:var(--brass-dim); color:var(--paper);}
  .session-item.active .dot{background:var(--brass);}

  .drawer-foot{
    flex:0 0 auto;
    padding:12px 16px calc(14px + var(--safe-bottom));
    border-top:1px solid var(--hairline);
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px; letter-spacing:0.08em;
    color:rgba(169,166,160,0.5);
  }
  .drawer-foot a{color:var(--brass-soft); text-decoration:none;}

  /* ---------- Chat area ---------- */
  main{
    flex:1 1 auto;
    overflow-y:auto;
    padding:20px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
    scroll-behavior:smooth;
  }
  .welcome{
    margin:auto 0;
    text-align:center;
    padding:24px 12px;
    opacity:0;
    animation: rise .7s ease forwards .1s;
  }
  .welcome .glyph{
    width:46px;height:46px;margin:0 auto 18px;
  }
  .welcome h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 8px;
    color:var(--paper);
  }
  .welcome p{
    font-size:13.5px;
    color:var(--paper-dim);
    max-width:280px;
    margin:0 auto;
    line-height:1.6;
  }
  .welcome-chips{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
    max-width:360px; margin:20px auto 0;
  }
  .chip{
    font-family:'Manrope',sans-serif;
    font-size:12.5px; font-weight:600;
    color:var(--paper-dim);
    background:rgba(255,255,255,0.02);
    border:1px solid var(--hairline);
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .chip:hover{border-color:var(--brass); color:var(--brass); background:var(--brass-dim);}
  .chip:active{transform:scale(0.96);}

  .row{display:flex; opacity:0; animation: rise .45s ease forwards;}
  .row.user{justify-content:flex-end;}
  .row.ai{justify-content:flex-start;}
  .bubble{
    max-width:78%;
    padding:11px 15px;
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .row.user .bubble{
    background:linear-gradient(155deg, var(--plum), #2c2337);
    border:1px solid rgba(201,162,39,0.22);
    border-radius:16px 16px 4px 16px;
    color:#f4eef2;
  }
  .row.ai .bubble{
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:16px 16px 16px 4px;
    color:var(--paper);
  }

  /* Markdown content inside AI bubbles */
  .bubble .md > *:first-child{margin-top:0;}
  .bubble .md > *:last-child{margin-bottom:0;}
  .bubble .md p{margin:0 0 8px;}
  .bubble .md ul, .bubble .md ol{margin:0 0 8px; padding-left:20px;}
  .bubble .md li{margin-bottom:3px;}
  .bubble .md strong{color:var(--brass); font-weight:700;}
  .bubble .md em{color:var(--paper);}
  .bubble .md a{color:var(--brass); text-decoration:underline; text-decoration-color:var(--hairline-strong);}
  .bubble .md code{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    background:rgba(0,0,0,0.28);
    border:1px solid var(--hairline);
    border-radius:5px;
    padding:1px 5px;
  }
  .bubble .md pre{
    position:relative;
    background:var(--ink);
    border:1px solid var(--hairline);
    border-radius:10px;
    padding:30px 12px 11px;
    overflow-x:auto;
    margin:0 0 8px;
  }
  .bubble .md pre code{
    background:none; border:none; padding:0;
    font-size:12px; line-height:1.5;
    color:var(--paper);
  }
  .code-copy-btn{
    position:absolute; top:6px; right:6px;
    display:flex; align-items:center; gap:4px;
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px; letter-spacing:0.05em; text-transform:uppercase;
    color:var(--paper-dim);
    background:rgba(255,255,255,0.04);
    border:1px solid var(--hairline);
    border-radius:7px;
    padding:4px 7px;
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .code-copy-btn:hover{color:var(--brass); border-color:var(--brass);}
  .code-copy-btn.copied{color:var(--brass); border-color:var(--hairline-strong); background:var(--brass-dim);}
  .code-copy-btn svg{width:10px;height:10px;}
  .bubble .md blockquote{
    margin:0 0 8px;
    padding:2px 0 2px 11px;
    border-left:2px solid var(--brass-soft);
    color:var(--paper-dim);
  }
  .bubble .md h1, .bubble .md h2, .bubble .md h3{
    font-family:'Cormorant Garamond',serif;
    color:var(--paper);
    margin:0 0 6px;
    line-height:1.25;
  }
  .bubble .md h1{font-size:19px;} .bubble .md h2{font-size:17px;} .bubble .md h3{font-size:15px;}
  .bubble .md hr{border:none; border-top:1px solid var(--hairline); margin:10px 0;}

  .typing{display:flex; gap:5px; padding:6px 4px;}
  .typing span{
    width:5px;height:5px;border-radius:50%;
    background:var(--brass);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .typing span:nth-child(2){animation-delay:.15s; transform:translateY(2px);}
  .typing span:nth-child(3){animation-delay:.3s;}

  @keyframes pulse{
    0%,60%,100%{opacity:.25; transform:translateY(0);}
    30%{opacity:1;}
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---------- Composer ---------- */
  footer{
    flex:0 0 auto;
    padding:12px 14px calc(14px + var(--safe-bottom));
    border-top:1px solid var(--hairline);
    background:linear-gradient(0deg, rgba(255,255,255,0.02), transparent);
  }
  .composer{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--ink-2);
    border:1px solid var(--hairline);
    border-radius:22px;
    padding:6px 6px 6px 16px;
  }
  .composer textarea{
    flex:1;
    resize:none;
    border:none;
    outline:none;
    background:transparent;
    color:var(--paper);
    font-family:'Manrope',sans-serif;
    font-size:14.5px;
    line-height:1.4;
    max-height:110px;
    padding:8px 0;
  }
  .composer textarea::placeholder{color:var(--paper-dim);}
  .attach-btn{
    width:34px;height:34px;border-radius:50%;flex:0 0 auto;
    border:none;
    background:transparent;
    color:var(--paper-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:color .15s ease, background .15s ease;
  }
  .attach-btn:active{transform:scale(0.9);}
  .attach-btn svg{width:19px;height:19px;}
  .attach-btn.has-image{color:var(--brass);}
  .preview-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 4px 8px;
  }
  .preview-thumb{
    position:relative;
    width:52px;height:52px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--hairline);
    flex:0 0 auto;
  }
  .preview-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .preview-remove{
    position:absolute;top:2px;right:2px;
    width:16px;height:16px;border-radius:50%;
    background:rgba(11,11,13,0.75);
    color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    border:none;padding:0;
  }
  .preview-remove svg{width:9px;height:9px;}
  .bubble img.msg-img{
    display:block;
    max-width:100%;
    border-radius:12px;
    margin-bottom:6px;
  }
  .send-btn{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    border:none;
    background:var(--brass);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .15s ease, opacity .15s ease;
  }
  .send-btn:active{transform:scale(0.9);}
  .send-btn:disabled{opacity:0.35; pointer-events:none;}
  .send-btn svg{width:16px;height:16px;}

  .credit{
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.08em;
    color:rgba(169,166,160,0.55);
    padding-top:10px;
  }
  .credit a{color:var(--brass-soft); text-decoration:none;}

  main::-webkit-scrollbar{width:4px;}
  main::-webkit-scrollbar-thumb{background:var(--hairline); border-radius:4px;}
</style>
</head>
<body>

<div class="app-shell">
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="eyebrow">Suhbatlar</div>
    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Yangi suhbat
    </button>
  </div>
  <div class="session-list" id="sessionList"></div>
  <div class="drawer-foot">MISUMI AI · rasmiy kanal <a href="https://t.me/{{ channel[1:] }}" target="_blank">{{ channel }}</a></div>
</aside>

<div class="chat-shell">
<header>
  <div class="icon-btn" id="menuBtn" title="Suhbatlar">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </div>
  <div class="mark">
    <svg viewBox="0 0 30 30" fill="none">
      <circle class="dot" cx="15" cy="6" r="2.4"/>
      <circle class="dot" cx="6" cy="22" r="2.4"/>
      <circle class="dot" cx="24" cy="22" r="2.4"/>
    </svg>
  </div>
  <div class="titles">
    <div class="name" id="sessionTitle">Misumi AI</div>
    <button class="model-picker" id="modelBtn" type="button">
      <span id="modelLabel">Misumi AI Flash</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <div class="model-menu" id="modelMenu"></div>
  </div>
  <div class="header-actions">
    <div class="icon-btn" id="resetBtn" title="Suhbatni o'chirish">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
    </div>
  </div>
</header>

<main id="chat">
  <div class="welcome" id="welcome">
    <div class="glyph">
      <svg viewBox="0 0 30 30" fill="none">
        <circle cx="15" cy="6" r="2.6" fill="#c9a227"/>
        <circle cx="6" cy="22" r="2.6" fill="#c9a227" opacity="0.7"/>
        <circle cx="24" cy="22" r="2.6" fill="#c9a227" opacity="0.7"/>
      </svg>
    </div>
    <h1 id="welcomeName">Xush kelibsiz.</h1>
    <p>Nima haqida bo'lmasin — savol bering, fikr almashing yoki shunchaki suhbatlashing. Men eslab qolaman.</p>
    <div class="welcome-chips" id="welcomeChips">
      <button class="chip" type="button">Film tavsiya qil</button>
      <button class="chip" type="button">Sayohat rejasini tuz</button>
      <button class="chip" type="button">Insho yozishda yordam ber</button>
      <button class="chip" type="button">Qiziqarli fakt ayt</button>
    </div>
  </div>
</main>

<footer>
  <div class="preview-row" id="previewRow" style="display:none;">
    <div class="preview-thumb">
      <img id="previewImg" src="" alt="">
      <button class="preview-remove" id="previewRemove">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>
  <div class="composer">
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <button class="attach-btn" id="attachBtn" title="Rasm biriktirish">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
    </button>
    <textarea id="input" rows="1" placeholder="Xabar yozing..."></textarea>
    <button class="send-btn" id="sendBtn" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
  <div class="credit">MISUMI AI · created by <a href="https://t.me/{{ author[1:] }}" target="_blank">{{ author }}</a> · kanal <a href="https://t.me/{{ channel[1:] }}" target="_blank">{{ channel }}</a></div>
</footer>
</div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    document.documentElement.style.setProperty('--safe-top', (tg.safeAreaInset?.top || 0) + 'px');
  }

  marked.setOptions({ breaks: true });

  const chatEl = document.getElementById('chat');
  const welcomeEl = document.getElementById('welcome');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const resetBtn = document.getElementById('resetBtn');
  const welcomeName = document.getElementById('welcomeName');
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const previewRow = document.getElementById('previewRow');
  const previewImg = document.getElementById('previewImg');
  const previewRemove = document.getElementById('previewRemove');
  const menuBtn = document.getElementById('menuBtn');
  const drawer = document.getElementById('drawer');
  const scrim = document.getElementById('scrim');
  const newChatBtn = document.getElementById('newChatBtn');
  const sessionListEl = document.getElementById('sessionList');
  const sessionTitleEl = document.getElementById('sessionTitle');
  const modelBtn = document.getElementById('modelBtn');
  const modelLabel = document.getElementById('modelLabel');
  const modelMenu = document.getElementById('modelMenu');

  let pendingImage = null; // data URL string

  // ---------- Model picker (Flash / Pro / Max) ----------
  const MODEL_TIERS = {{ model_tiers_json | safe }};
  const DEFAULT_MODEL = {{ default_model | tojson }};
  const CHANNEL_HANDLE = {{ channel | tojson }};
  const AUTHOR_HANDLE = {{ author | tojson }};
  const MODEL_KEY = 'misumi_model_v1';

  let selectedModel = localStorage.getItem(MODEL_KEY) || DEFAULT_MODEL;
  if (!MODEL_TIERS.find(m => m.id === selectedModel)) selectedModel = DEFAULT_MODEL;
  let isPremium = false;

  function tierById(id){ return MODEL_TIERS.find(m => m.id === id) || MODEL_TIERS[0]; }

  function setSelectedModel(id, { silent } = {}){
    selectedModel = id;
    localStorage.setItem(MODEL_KEY, id);
    modelLabel.textContent = tierById(id).label;
    renderModelMenu();
  }

  function renderModelMenu(){
    modelMenu.innerHTML = '';
    for (const tier of MODEL_TIERS) {
      const locked = tier.premium && !isPremium;
      const opt = document.createElement('div');
      opt.className = 'model-option' + (tier.id === selectedModel ? ' active' : '') + (locked ? ' locked' : '');
      opt.innerHTML = `
        <div class="model-dot"></div>
        <div class="model-text">
          <div class="model-label">${tier.label}</div>
          <div class="model-tag"></div>
        </div>
        ${locked ? `<div class="lock-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>PRO</div>` : ''}
      `;
      opt.querySelector('.model-tag').textContent = tier.tagline;
      opt.addEventListener('click', () => {
        if (locked) {
          tg?.HapticFeedback?.notificationOccurred('warning');
          addRow('ai', `🔒 ${tier.label} — faqat Pro foydalanuvchilar uchun. Ochish uchun ${AUTHOR_HANDLE} ga yozing yoki rasmiy kanalni kuzatib boring: ${CHANNEL_HANDLE}.`);
          closeModelMenu();
          return;
        }
        tg?.HapticFeedback?.impactOccurred('light');
        setSelectedModel(tier.id);
        closeModelMenu();
      });
      modelMenu.appendChild(opt);
    }
  }

  function openModelMenu(){ modelMenu.classList.add('open'); modelBtn.classList.add('open'); }
  function closeModelMenu(){ modelMenu.classList.remove('open'); modelBtn.classList.remove('open'); }
  modelBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    modelMenu.classList.contains('open') ? closeModelMenu() : openModelMenu();
  });
  document.addEventListener('click', (e) => {
    if (!modelMenu.contains(e.target) && e.target !== modelBtn) closeModelMenu();
  });

  setSelectedModel(selectedModel);

  async function loadPremiumStatus(){
    try {
      const res = await fetch('/api/me', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ initData: tg?.initData || '' })
      });
      const data = await res.json();
      isPremium = !!data.premium;
    } catch (e) { isPremium = false; }
    if (!isPremium && tierById(selectedModel).premium) setSelectedModel(DEFAULT_MODEL);
    renderModelMenu();
  }
  loadPremiumStatus();

  // ---------- Copy-to-clipboard for AI code blocks ----------
  function addCodeCopyButtons(container){
    container.querySelectorAll('pre').forEach(pre => {
      if (pre.querySelector('.code-copy-btn')) return;
      const btn = document.createElement('button');
      btn.className = 'code-copy-btn';
      btn.type = 'button';
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span>Copy</span>`;
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const code = pre.querySelector('code')?.textContent ?? pre.textContent;
        try {
          await navigator.clipboard.writeText(code);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = code;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        tg?.HapticFeedback?.notificationOccurred('success');
        btn.classList.add('copied');
        btn.querySelector('span').textContent = 'Copied';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.querySelector('span').textContent = 'Copy';
        }, 1600);
      });
      pre.appendChild(btn);
    });
  }

  const firstName = tg?.initDataUnsafe?.user?.first_name;
  if (firstName) welcomeName.textContent = `Xush kelibsiz, ${firstName}.`;

  document.getElementById('welcomeChips')?.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    tg?.HapticFeedback?.impactOccurred('light');
    inputEl.value = chip.textContent.trim();
    updateSendState();
    send();
  });

  // ---------- Session storage (per-device, local only) ----------
  // Note: this only organizes the chat *display* into separate threads.
  // The AI's own short-term memory on the server is still a single
  // continuous stream per Telegram user, not per session.
  const STORAGE_KEY = 'misumi_sessions_v1';
  const CURRENT_KEY = 'misumi_current_session_v1';

  function loadSessions(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) { return []; }
  }
  function saveSessions(list){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
  }
  function newSessionId(){ return 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8); }

  let sessions = loadSessions();
  let currentId = localStorage.getItem(CURRENT_KEY);
  if (!currentId || !sessions.find(s => s.id === currentId)) {
    if (sessions.length === 0) {
      const s = { id: newSessionId(), title: null, messages: [], updatedAt: Date.now() };
      sessions.unshift(s);
      saveSessions(sessions);
    }
    currentId = sessions[0].id;
    localStorage.setItem(CURRENT_KEY, currentId);
  }

  function currentSession(){ return sessions.find(s => s.id === currentId); }

  function renderSessionList(){
    sessionListEl.innerHTML = '';
    sessions.sort((a, b) => b.updatedAt - a.updatedAt);
    for (const s of sessions) {
      const item = document.createElement('div');
      item.className = 'session-item' + (s.id === currentId ? ' active' : '');
      item.innerHTML = `
        <div class="dot"></div>
        <div class="label"></div>
        <div class="del" title="O'chirish">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>`;
      item.querySelector('.label').textContent = s.title || 'Yangi suhbat';
      item.addEventListener('click', (e) => {
        if (e.target.closest('.del')) return;
        switchSession(s.id);
      });
      item.querySelector('.del').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteSession(s.id);
      });
      sessionListEl.appendChild(item);
    }
  }

  function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('open'); }
  function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); }
  menuBtn.addEventListener('click', () => { renderSessionList(); openDrawer(); });
  scrim.addEventListener('click', closeDrawer);

  function switchSession(id){
    currentId = id;
    localStorage.setItem(CURRENT_KEY, currentId);
    renderChatFromSession();
    renderSessionList();
    closeDrawer();
  }

  function deleteSession(id){
    sessions = sessions.filter(s => s.id !== id);
    if (sessions.length === 0) {
      sessions.push({ id: newSessionId(), title: null, messages: [], updatedAt: Date.now() });
    }
    saveSessions(sessions);
    if (id === currentId) {
      currentId = sessions[0].id;
      localStorage.setItem(CURRENT_KEY, currentId);
      renderChatFromSession();
    }
    renderSessionList();
  }

  newChatBtn.addEventListener('click', () => {
    const s = { id: newSessionId(), title: null, messages: [], updatedAt: Date.now() };
    sessions.unshift(s);
    saveSessions(sessions);
    switchSession(s.id);
  });

  function renderChatFromSession(){
    chatEl.innerHTML = '';
    const s = currentSession();
    sessionTitleEl.textContent = s?.title || 'Misumi AI';
    if (!s || s.messages.length === 0) {
      chatEl.appendChild(welcomeEl);
      return;
    }
    for (const m of s.messages) {
      renderRow(m.role, m.text, m.image);
    }
    scrollToBottom();
  }

  function scrollToBottom(){
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function renderRow(role, text, imageUrl){
    if (welcomeEl.parentNode) welcomeEl.remove();
    const row = document.createElement('div');
    row.className = `row ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (imageUrl) {
      const img = document.createElement('img');
      img.className = 'msg-img';
      img.src = imageUrl;
      bubble.appendChild(img);
    }
    if (text) {
      if (role === 'ai') {
        const mdWrap = document.createElement('div');
        mdWrap.className = 'md';
        mdWrap.innerHTML = DOMPurify.sanitize(marked.parse(text));
        bubble.appendChild(mdWrap);
        addCodeCopyButtons(mdWrap);
      } else {
        const textNode = document.createElement('div');
        textNode.textContent = text;
        bubble.appendChild(textNode);
      }
    }
    row.appendChild(bubble);
    chatEl.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function addRow(role, text, imageUrl){
    const bubble = renderRow(role, text, imageUrl);
    const s = currentSession();
    s.messages.push({ role, text: text || '', image: imageUrl || null });
    s.updatedAt = Date.now();
    if (!s.title && role === 'user' && text) {
      s.title = text.length > 42 ? text.slice(0, 42).trim() + '…' : text;
      sessionTitleEl.textContent = s.title;
    }
    saveSessions(sessions);
    return bubble;
  }

  function addTyping(){
    if (welcomeEl.parentNode) welcomeEl.remove();
    const row = document.createElement('div');
    row.className = 'row ai';
    row.id = 'typingRow';
    row.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    chatEl.appendChild(row);
    scrollToBottom();
  }

  function removeTyping(){
    document.getElementById('typingRow')?.remove();
  }

  function updateSendState(){
    sendBtn.disabled = inputEl.value.trim().length === 0 && !pendingImage;
  }

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 110) + 'px';
    updateSendState();
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    const file = fileInput.files?.[0];
    if (!file) return;
    tg?.HapticFeedback?.impactOccurred('light');
    const reader = new FileReader();
    reader.onload = () => {
      pendingImage = reader.result;
      previewImg.src = pendingImage;
      previewRow.style.display = 'flex';
      attachBtn.classList.add('has-image');
      updateSendState();
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  previewRemove.addEventListener('click', () => {
    pendingImage = null;
    previewRow.style.display = 'none';
    attachBtn.classList.remove('has-image');
    updateSendState();
  });

  sendBtn.addEventListener('click', send);

  async function send(){
    const text = inputEl.value.trim();
    const image = pendingImage;
    if (!text && !image) return;
    tg?.HapticFeedback?.impactOccurred('light');
    inputEl.value = '';
    inputEl.style.height = 'auto';
    pendingImage = null;
    previewRow.style.display = 'none';
    attachBtn.classList.remove('has-image');
    sendBtn.disabled = true;
    addRow('user', text, image);
    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ initData: tg?.initData || '', message: text, image: image || undefined, model: selectedModel })
      });
      const data = await res.json();
      removeTyping();
      if (!res.ok) {
        addRow('ai', 'Kechirasiz, xatolik yuz berdi. Birozdan so\'ng qayta urinib ko\'ring.');
      } else if (data.generated_image) {
        addRow('ai', '', data.generated_image);
      } else {
        addRow('ai', data.reply);
      }
      // Server enforces premium gating — if it ran a different tier than
      // requested (e.g. Pro/Max without premium), keep the picker in sync.
      if (data.model && data.model !== selectedModel) setSelectedModel(data.model);
    } catch (err) {
      removeTyping();
      addRow('ai', 'Ulanishda xatolik. Internetni tekshirib, qayta urinib ko\'ring.');
    }
  }

  resetBtn.addEventListener('click', async () => {
    tg?.HapticFeedback?.impactOccurred('medium');
    try {
      await fetch('/api/reset', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ initData: tg?.initData || '' })
      });
    } catch (e) {}
    const s = currentSession();
    s.messages = [];
    s.title = null;
    saveSessions(sessions);
    renderChatFromSession();
  });

  renderChatFromSession();
</script>
</body>
</html>
