<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mafia — {{ bot_name }}</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
{% raw %}
<style>
:root{--town:#3ddcb0;--mafia:#ff4d5a;--maniac:#ffb02e;--ink:#f3f1ff;--mut:#a29fc2;--card:rgba(14,12,32,.74);--line:rgba(255,255,255,.12);--acc:#7c5cff;--ser:Georgia,'Times New Roman',serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0818;color:var(--ink);font:14px/1.38 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--sat)}
/* osmon */
.sky{position:fixed;inset:0;opacity:0;transition:opacity 1.2s}
.s-lobby{background:linear-gradient(#17112f,#2c2152 70%,#3b2a63)}.s-night{background:linear-gradient(#04061a,#0d1636 55%,#1b2552)}
.s-day{background:linear-gradient(#5aa9ff,#9fd0ff 55%,#ffe2b0)}.s-vote{background:linear-gradient(#2a1233,#8a2b4a 55%,#ff8a4c)}.s-end{background:linear-gradient(#0e0a24,#2a1b52 60%,#4a2c6e)}
body.lobby .s-lobby,body.reveal .s-lobby,body.night .s-night,body.day .s-day,body.vote .s-vote,body.ended .s-end{opacity:1}
#stars{position:fixed;inset:0;opacity:0;transition:opacity 1.2s;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 22%,#cfe,transparent),radial-gradient(1px 1px at 63% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 82% 26%,#fff,transparent),radial-gradient(1px 1px at 92% 9%,#fff,transparent),radial-gradient(1px 1px at 7% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 40%,#fff,transparent);animation:tw 4s infinite alternate}
body.night #stars,body.lobby #stars,body.reveal #stars,body.ended #stars{opacity:.9}
@keyframes tw{to{opacity:.45}}
#orb{position:fixed;width:54px;height:54px;border-radius:50%;left:78%;top:9%;transition:all 1.6s cubic-bezier(.4,0,.2,1);background:radial-gradient(circle at 35% 35%,#fffbe8,#f2e6b8 60%,#cdbb86);box-shadow:0 0 40px 12px rgba(255,248,210,.35)}
body.day #orb{left:18%;top:11%;background:radial-gradient(circle,#fff6b0,#ffd23f 65%);box-shadow:0 0 60px 24px rgba(255,210,63,.55)}
body.vote #orb{left:10%;top:27%;background:radial-gradient(circle,#ffd0a0,#ff6a3d 70%);box-shadow:0 0 70px 30px rgba(255,90,40,.5)}
#city{position:fixed;left:0;right:0;bottom:34vh;width:100%;height:20vh}
#city .w{animation:lt 5s infinite alternate}body.day #city .w{opacity:.15;animation:none}@keyframes lt{0%{opacity:.35}100%{opacity:1}}
.cloud{position:fixed;left:-30%;width:150px;height:44px;border-radius:44px;background:#fff;opacity:0;filter:blur(2px);animation:cl var(--d) linear infinite;box-shadow:40px -14px 0 8px #fff,85px 4px 0 -2px #fff}
body.day .cloud{opacity:.85}@keyframes cl{to{left:120%}}
.fog{position:fixed;left:-20%;right:-20%;bottom:30vh;height:26vh;opacity:0;background:radial-gradient(ellipse,rgba(180,190,255,.22),transparent 70%);animation:fg 16s ease-in-out infinite alternate;transition:opacity 1.5s}
body.night .fog,body.lobby .fog,body.ended .fog{opacity:1}@keyframes fg{to{transform:translateX(12%)}}
/* yuqori panel */
#top{position:relative;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bar{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden}
#bar i{display:block;height:100%;background:linear-gradient(90deg,var(--town),#fff);transform-origin:left;transition:transform .25s linear}
#bar.low i{background:var(--mafia)}
#me{cursor:pointer}
/* stol */
#stage{position:relative;z-index:3;flex:1;min-height:0}
#table{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:min(calc(100% - 8px),94vw);aspect-ratio:1}
#felt{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle,rgba(40,30,80,.55),rgba(10,8,26,.62));border:1px solid var(--line);box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#center{position:absolute;inset:31%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:1}
#ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#ring circle{fill:none;stroke-width:3}#ring .bg{stroke:rgba(255,255,255,.12)}#ring .fg{stroke:var(--town);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
#tnum{font:700 30px var(--ser)}#tnum.pulse{color:var(--mafia);animation:hb .5s infinite alternate}@keyframes hb{to{transform:scale(1.15)}}
#tlab{font-size:11px;color:var(--mut);max-width:92%}
.seat{position:absolute;width:var(--sz);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:3;cursor:pointer}
.av{position:relative;width:var(--sz);height:var(--sz);border-radius:50%;display:grid;place-items:center;font:700 calc(var(--sz)*.42) var(--ser);color:#fff;border:2px solid rgba(255,255,255,.35);box-shadow:0 4px 14px rgba(0,0,0,.4);transition:box-shadow .2s,border-color .2s}
.av:after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.32),transparent 55%)}
.seat.ok .av{animation:pl 1.4s infinite}@keyframes pl{50%{box-shadow:0 0 0 5px rgba(255,255,255,.24),0 4px 14px rgba(0,0,0,.45)}}
.seat.pend .av{border-color:#fff;border-style:dashed;box-shadow:0 0 0 4px rgba(255,255,255,.35);animation:none}
.seat.sel .av{border-color:#fff;box-shadow:0 0 0 4px var(--maniac),0 0 24px var(--maniac);animation:none}
.seat.me .av{border-color:var(--town)}
.seat.dead .av{filter:grayscale(1) brightness(.55)}.seat.dead:after{content:'💀';position:absolute;top:calc(var(--sz)*.16);left:50%;transform:translateX(-50%);font-size:calc(var(--sz)*.5)}
.nm{margin-top:3px;font-size:10.5px;font-weight:600;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px #000}
body.day .nm{text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.6)}
.rb{position:absolute;right:-6px;top:-6px;background:#15122e;border:1px solid var(--line);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px;z-index:1}
.vb{position:absolute;left:-6px;top:-6px;background:var(--maniac);color:#1a1200;border-radius:99px;min-width:19px;height:19px;padding:0 5px;font:700 11px/19px system-ui;text-align:center;z-index:1}
.bub{position:absolute;bottom:100%;margin-bottom:5px;left:50%;transform:translateX(-50%);width:max-content;max-width:104px;background:#fff;color:#16122e;border-radius:12px;padding:4px 8px;font-size:11px;font-weight:600;line-height:1.25;z-index:4;animation:bp .2s;pointer-events:none}
.bub:after{content:'';position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
@keyframes bp{from{transform:translateX(-50%) scale(.5);opacity:0}}
/* dock */
#dock{position:relative;z-index:6;height:40vh;max-height:340px;min-height:240px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:2px solid var(--line);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:var(--sab);transition:border-color .6s}
body.day #dock{background:rgba(18,16,44,.9)}
#dock.min{height:auto;min-height:0}#dock.min .pane,#dock.min #tabs{display:none!important}
/* bo'limlar: Chat / Jurnal / Rollar alohida to'liq sahifa bo'lib ochiladi */
#p-roles,#p-log{text-align:left}
#pghead{display:none;align-items:center;gap:10px;padding:10px 14px 8px;flex:none}
#pgback{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 13px;font-weight:700;font-size:13px}
#pgtitle{font:700 18px var(--ser)}
#dock.full{position:fixed;left:0;right:0;top:var(--sat);bottom:0;height:auto;max-height:none;min-height:0;border-radius:0;z-index:20;background:rgba(10,8,24,.97)}
#dock.full #pghead{display:flex;order:1}
#dock.full .pane{order:2}
#dock.full #tabs{order:3;padding:6px 10px calc(4px + var(--sab));border-top:1px solid var(--line)}
#dock.full #grip{display:none}
.pg-sec{margin:0 0 14px}.pg-sec>h4{margin:0 0 6px;font:700 11px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.ph3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph3>div{background:rgba(255,255,255,.07);border-radius:12px;padding:9px 6px;text-align:center;font-size:11px;color:var(--mut);line-height:1.35}
.ph3 b{display:block;font-size:12.5px;color:var(--ink);margin:2px 0}
.ph3 i{font-style:normal;font-size:20px}
.pg-win{display:grid;gap:6px}
.pg-win>div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 11px;font-size:12.5px;color:var(--mut);border-left:3px solid var(--town)}
.pg-win>div.mafia{border-color:var(--mafia)}.pg-win>div.maniac{border-color:var(--maniac)}
.pg-win b{color:var(--ink)}
.rl.one{grid-template-columns:1fr}
.rc .rt{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:var(--maniac)}
#grip{width:56px;height:20px;display:grid;place-items:center;margin:0 auto;flex:none}#grip:before{content:'';width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.3)}
#tabs{display:flex;gap:4px;padding:0 10px}
#tabs button{flex:1;color:var(--mut);padding:8px 2px;border-radius:12px;font-weight:600;position:relative;font-size:13px}
#tabs button.on{background:rgba(255,255,255,.1);color:var(--ink)}
#tabs b{position:absolute;top:3px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--mafia);display:none}
.pane{display:none;flex:1;min-height:0;overflow:auto;padding:10px 14px;-webkit-overflow-scrolling:touch}
.pane.on{display:block}#p-chat.on{display:flex;flex-direction:column}
h3{margin:0 0 4px;font:700 17px var(--ser)}.mut{color:var(--mut);font-size:12.5px}
.btn{display:block;width:100%;background:linear-gradient(135deg,#7c5cff,#c14bff);padding:12px;border-radius:14px;font-weight:700;margin-top:8px;box-shadow:0 6px 18px rgba(124,92,255,.32);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}.btn.alt{background:rgba(255,255,255,.1);box-shadow:none}.btn.red{background:linear-gradient(135deg,#ff4d5a,#b3203f);box-shadow:0 6px 18px rgba(255,77,90,.3)}.btn.good{background:linear-gradient(135deg,#2fcf9f,#17996f);box-shadow:none}
.btn:disabled{opacity:.4;pointer-events:none}.row{display:flex;gap:8px}.row .btn{flex:1}
.note{background:rgba(255,255,255,.08);border-left:3px solid var(--maniac);border-radius:8px;padding:7px 10px;margin:6px 0;font-size:13px}
.note.ok{border-color:var(--town)}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.pl span{background:rgba(255,255,255,.1);border-radius:99px;padding:4px 10px;font-size:12.5px}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.m{display:flex;gap:7px;align-items:flex-end;max-width:88%}.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .b{background:rgba(255,255,255,.1);padding:6px 10px;border-radius:14px 14px 14px 4px;overflow-wrap:anywhere}.m.me .b{background:rgba(124,92,255,.55);border-radius:14px 14px 4px 14px}
.m .a{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 11px var(--ser);color:#fff}
.m small{display:block;color:var(--mut);font-size:10.5px;font-weight:700}.m.mafia .b{border:1px solid var(--mafia)}.m.dead .b{opacity:.7;font-style:italic}
#chs{font-size:11.5px;color:var(--mut);padding-bottom:5px}
#qp{display:flex;gap:6px;overflow-x:auto;padding-top:6px;scrollbar-width:none}#qp::-webkit-scrollbar{display:none}
#qp button{flex:none;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12.5px}
#cf{display:flex;gap:6px;margin-top:8px}#cf input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);font:inherit;outline:0}
#cf button{background:var(--acc);border-radius:14px;padding:0 16px;font-size:16px}#cf.off{opacity:.45;pointer-events:none}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}.tl div{position:relative;margin:0 0 9px}
.tl div:before{content:'';position:absolute;left:-18px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--mut)}
.tl .death:before,.tl .lynch:before{background:var(--mafia)}.tl .night:before{background:#6b7cff}.tl .vote:before{background:var(--maniac)}
.rl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rc{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px;border-top:3px solid var(--town)}
.rc.mafia{border-color:var(--mafia)}.rc.maniac{border-color:var(--maniac)}.rc.mine{outline:2px solid #fff}.rc b{display:block}.rc span{font-size:11.5px;color:var(--mut)}
/* overlay */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,3,16,.84);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px}.ov.on{display:flex}
#card{width:min(78vw,300px);aspect-ratio:3/4.2;perspective:900px;cursor:pointer}
#cin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}#card.flip #cin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.f1{background:repeating-linear-gradient(45deg,#2a1b52,#2a1b52 10px,#34226a 10px,#34226a 20px);border:2px solid var(--acc);font:700 22px var(--ser)}
.f2{transform:rotateY(180deg);background:linear-gradient(160deg,#1c1744,#0e0b26);border:2px solid var(--c,var(--town));box-shadow:0 0 40px var(--c,var(--town))}
.f2 .em{font-size:72px;filter:drop-shadow(0 0 18px var(--c))}.f2 h2{margin:4px 0;font:700 28px var(--ser)}.f2 .tm{color:var(--c);font-weight:700;letter-spacing:1.5px;font-size:12px}
#ovd{background:radial-gradient(circle,rgba(90,0,20,.88),rgba(5,0,8,.96))}.big{font:700 34px var(--ser);margin:6px 0}
#pbox,#endbox,#deadbox{width:min(88vw,340px);text-align:center}
#pbox{background:linear-gradient(160deg,#1c1744,#0e0b26);border:1px solid var(--line);border-radius:22px;padding:20px 16px;animation:bp2 .25s}@keyframes bp2{from{transform:scale(.88);opacity:0}}
#pbox .av{width:72px;height:72px;font-size:30px;margin:0 auto 8px}
.st{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}.st span{background:rgba(255,255,255,.09);border-radius:99px;padding:4px 11px;font-size:12.5px}
.pm{background:rgba(255,255,255,.07);border-radius:10px;padding:6px 10px;margin-top:5px;text-align:left;font-size:12.5px}
.sum{max-height:38vh;overflow:auto;text-align:left;width:100%;margin-top:10px}.sum div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
#ann{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;pointer-events:none}
#ann.on{display:flex;animation:an 2.2s forwards}#ann div{font:700 clamp(34px,11vw,56px) var(--ser);text-shadow:0 0 30px #000,0 4px 12px #000;text-align:center;letter-spacing:2px}
@keyframes an{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
#toasts{position:fixed;top:calc(52px + var(--sat));left:12px;right:12px;z-index:25;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.t{background:rgba(20,16,44,.94);border:1px solid var(--line);border-left:4px solid var(--maniac);border-radius:12px;padding:9px 12px;animation:ti .3s,to .4s 3.8s forwards}.t.bad{border-left-color:var(--mafia)}
@keyframes ti{from{transform:translateY(-12px);opacity:0}}@keyframes to{to{opacity:0;transform:translateY(-8px)}}
.cf{position:fixed;top:-30px;z-index:40;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#2a1b52,#07050f);display:grid;place-items:center;text-align:center;transition:opacity .8s,visibility .8s}
#splash.off{opacity:0;visibility:hidden}#splash .lg{font-size:76px;animation:fl 2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) rotate(-6deg)}}
#splash h1{margin:6px 0;font:700 40px var(--ser);letter-spacing:10px}
.full{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;padding:30px;background:#0a0818}.full h2{font:700 24px var(--ser);margin:8px 0}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01s!important}}
</style>
{% endraw %}
</head>
<body class="lobby">
<div class="sky s-lobby"></div><div class="sky s-night"></div><div class="sky s-day"></div><div class="sky s-vote"></div><div class="sky s-end"></div>
<div id="stars"></div><div id="orb"></div><div class="cloud" style="top:13%;--d:70s"></div><div class="cloud" style="top:25%;--d:110s;transform:scale(.65)"></div>
<div class="fog"></div><div class="fog" style="bottom:36vh;animation-duration:21s;animation-direction:alternate-reverse"></div>
<svg id="city" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
<div id="app">
  <div id="top"><div class="chip" id="ph">🎭 Mafia</div><div id="bar"><i></i></div><button class="chip" id="snd" aria-label="Ovoz">🔊</button><button class="chip" id="me">…</button></div>
  <div id="stage"><div id="table"><div id="felt"></div><svg id="lines" viewBox="0 0 100 100"></svg>
    <div id="center"><svg id="ring" viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="47"/><circle class="fg" cx="50" cy="50" r="47" stroke-dasharray="295.3" stroke-dashoffset="0"/></svg><div id="tnum"></div><div id="tlab"></div></div>
  </div></div>
  <div id="dock">
    <button id="grip" aria-label="Panelni yig'ish"></button>
    <div id="pghead"><button id="pgback" type="button">‹ O'yin</button><div id="pgtitle"></div></div>

</div>

<div class="ov" id="ove"><div id="endbox"></div></div>
<div class="ov" id="ovd"><div id="deadbox"></div></div>
<div class="ov" id="ovp"><div id="pbox"></div></div>
<div id="splash"><div><div class="lg">🎭</div><h1>MAFIA</h1><p class="mut">Shahar uxlaydi…</p></div></div>
<div id="ann"><div></div></div><div id="toasts"></div>

<script>
(() => {
'use strict';
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#0a0818'); tg.setBackgroundColor('#0a0818'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ovoz effektlari */
function snd(k) {
  if (!sOn || !k) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const q = {night: [[196, 0, .6], [147, .35, .8]], day: [[392, 0, .2], [523, .15, .3], [659, .3, .5]], vote: [[330, 0, .15], [330, .2, .15], [440, .4, .5]],
      death: [[110, 0, .5], [82, .3, .9]], win: [[523, 0, .2], [659, .18, .2], [784, .36, .2], [1046, .54, .6]], tap: [[600, 0, .06]]}[k] || [];
    q.forEach(([f, t, d]) => {
      const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
      o.type = k === 'death' || k === 'night' ? 'sine' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, n + t); g.gain.exponentialRampToValueAtTime(.12, n + t + .03); g.gain.exponentialRampToValueAtTime(.0001, n + t + d);
      o.connect(g); g.connect(ac.destination); o.start(n + t); o.stop(n + t + d + .05);
    });
  } catch (e) {}
}
$('#snd').textContent = sOn ? '🔊' : '🔇';
$('#snd').onclick = () => { sOn = !sOn; $('#snd').textContent = sOn ? '🔊' : '🔇'; try { localStorage.setItem('mf_snd', sOn ? '1' : '0'); } catch (e) {} snd('tap'); };

/* shahar siluyeti */
(function () {
  let x = 0, s = '', r = 7; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280;
  while (x < 400) {
    const w = 18 + rnd() * 26, h = 30 + rnd() * 78;
    s += `<rect x="${x}" y="${120 - h}" width="${w}" height="${h}" fill="#070612"/>`;
    for (let i = 0; i < w / 7; i++) for (let j = 0; j < h / 11; j++) if (rnd() < .28)
      s += `<rect class="w" style="animation-delay:${(rnd() * 4).toFixed(1)}s" x="${x + 3 + i * 7}" y="${120 - h + 4 + j * 11}" width="3" height="4" fill="#ffd978"/>`;
    x += w + 1;
  }
  $('#city').innerHTML = s;
})();

function toast(t, bad, ms) { const d = document.createElement('div'); d.className = 't' + (bad ? ' bad' : ''); d.textContent = t; $('#toasts').appendChild(d); setTimeout(() => d.remove(), ms || 4300); }
function announce(t, c) { const a = $('#ann'); a.firstElementChild.textContent = t; a.firstElementChild.style.color = c || '#fff'; a.classList.remove('on'); void a.offsetWidth; a.classList.add('on'); }
function fatal(icon, title, text) {
  dead = true; $('#splash').classList.add('off');
  document.body.insertAdjacentHTML('beforeend', `<div class="full"><div><div style="font-size:60px">${icon}</div><h2>${esc(title)}</h2><p class="mut">${esc(text)}</p></div></div>`);
}

/* tarmoq */
async function api(p, ex) {
  const r = await fetch('/api/mafia/' + p, {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(Object.assign({initData: tg ? tg.initData : '', gid}, ex || {}))});
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || 'http'); err.status = r.status; throw err; }
  return j;
}
function netErr(e) {
  if (e.status === 401) return fatal('✈️', "Telegram ichida oching", "Bu sahifa faqat Telegram Mini App sifatida ishlaydi.");
  if (e.status === 404) return fatal('🕳', "O'yin topilmadi", "O'yin tugagan yoki havola eskirgan. Guruhda /mafia deb yangisini oching.");
  const n = Date.now(); if (n - lastErrToast > 8000) { lastErrToast = n; toast("Aloqa uzildi, qayta urinilmoqda…", true); }
}
async function act(p, ex) {
  if (busy || dead) return; busy = true;
  try {
    const v = await api(p, ex);
    if (v.result && !v.result.ok) { toast(v.result.msg, true); hap('n', 'error'); } else { hap('light'); snd('tap'); }
    apply(v, true);
  } catch (e) { netErr(e); }
  busy = false; if (V) render();
}
async function poll() {
  if (dead) return;
  try { apply(await api('state')); fails = 0; } catch (e) { fails++; netErr(e); }
  if (!dead) setTimeout(poll, fails > 2 ? 3000 : 1000);
}

/* holat */
function apply(v, force) {
  const old = V; V = v; off = v.now - Date.now() / 1000;
  if (boot) {
    boot = false; seenFeed = maxId(v.feed); seenPriv = maxId(v.private); seenChat = maxId(v.chat);
    prev = {phase: v.phase, day: v.day, alive: v.me ? v.me.alive : true};
    lastVer = v.version;
    if (v.phase === 'reveal') openCard();
    if (v.phase === 'ended') setTimeout(showEnd, 600);
    return render();
  }
  if (!force && v.version === lastVer && old && old.phase === v.phase) return;
  lastVer = v.version;
  if (prev.phase !== v.phase || prev.day !== v.day) { pend = []; onPhase(v); }
  if (v.me && prev.alive && !v.me.alive && v.phase !== 'ended') { setTimeout(showDead, 700); snd('death'); hap('n', 'error'); }
  prev = {phase: v.phase, day: v.day, alive: v.me ? v.me.alive : true};
  for (const f of v.feed) if (f.id > seenFeed) { seenFeed = f.id; if (f.kind === 'death' || f.kind === 'lynch') toast('☠ ' + f.text, true); else if (f.kind === 'info' && /hech kim/i.test(f.text)) toast(f.text); }
  for (const f of v.private) if (f.id > seenPriv) { seenPriv = f.id; toast(f.text); hap('n', f.kind === 'death' ? 'error' : 'success'); }
  render();
}
function onPhase(v) {
  const d = v.day, m = v.me;
  snd({night: 'night', day: 'day', vote: 'vote'}[v.phase]);
  if (v.phase === 'reveal') openCard();
  else if (v.phase === 'night') { announce(`🌙 ${d}-TUN`, '#9db4ff'); $('#ovr').classList.remove('on'); }
  else if (v.phase === 'day') announce(`☀️ ${d}-KUN`, '#ffe08a');
  else if (v.phase === 'vote') announce('🗳 OVOZ BERISH', '#ffb02e');
  else if (v.phase === 'ended') { setTimeout(showEnd, 900); if (m && m.team === v.winner) snd('win'); }
  hap('n', 'warning');
  setTab('act');
}

  $('#ph').textContent = v.phase === 'night' ? `🌙 ${v.day}-tun` : v.phase === 'day' ? `☀️ ${v.day}-kun` : v.phase === 'vote' ? `🗳 ${v.day}-kun` : PH[v.phase];
  $('#me').innerHTML = m && m.role ? `${m.role_emoji} ${esc(m.role_name)}` : `👥 ${v.players.length}/${v.max_players}`;
  $('#dock').style.borderTopColor = m && m.team ? TC[m.team] : '';
  table(); panelAct(); panelChat(); panelQ(); panelLog(); panelRoles(); tick();
}
function bubbles() {
  const b = {};
  if (V && ['day', 'vote'].includes(V.phase)) V.chat.forEach(c => { if (c.ch === 'day' && nowSrv() - c.t < 9) b[c.uid] = c.text.length > 56 ? c.text.slice(0, 54) + '…' : c.text; });
  return b;
}
function table() {
  const v = V, m = v.me; let ps = v.players.slice();
  const i = ps.findIndex(p => m && p.uid === m.uid); if (i > 0) ps = ps.slice(i).concat(ps.slice(0, i));
  const n = ps.length, sz = n <= 7 ? 58 : n <= 10 ? 50 : n <= 13 ? 42 : 36, R = n > 10 ? 38 : 36;
  $('#table').style.setProperty('--sz', sz + 'px');
  const canPick = !!(m && m.alive && (v.phase === 'night' || v.phase === 'vote'));
  const ok = new Set(canPick ? m.targets : []);
  const mine = new Set();
  if (m && v.phase === 'night') [m.my_target, m.my_target2].forEach(t => { if (t != null) mine.add(t); });
  if (m && v.phase === 'vote' && typeof m.my_vote === 'number') mine.add(m.my_vote);
  const cnt = {}, votes = v.votes || {};
  for (const k in votes) { const t = votes[k]; if (t !== 'skip') cnt[t] = (cnt[t] || 0) + 1; }
  const bub = bubbles(); bubSig = JSON.stringify(bub);
  const pos = {}; let h = '';
  ps.forEach((p, k) => {
    const a = Math.PI / 2 + k * 2 * Math.PI / n, x = 50 + R * Math.cos(a), y = 50 + R * Math.sin(a); pos[p.uid] = [x, y];
    const cls = ['seat']; if (!p.alive) cls.push('dead'); if (ok.has(p.uid)) cls.push('ok'); if (pend.includes(p.uid)) cls.push('pend'); if (mine.has(p.uid)) cls.push('sel'); if (m && p.uid === m.uid) cls.push('me');
    h += `<div class="${cls.join(' ')}" data-u="${p.uid}" style="left:${x}%;top:${y}%">${bub[p.uid] ? `<div class="bub">${esc(bub[p.uid])}</div>` : ''}<div class="av" style="background:${hue(p.uid)}">${ini(p)}${p.role_emoji ? `<span class="rb">${p.role_emoji}</span>` : ''}${cnt[p.uid] ? `<span class="vb">${cnt[p.uid]}</span>` : ''}</div><div class="nm">${esc(p.name)}</div></div>`;
  });
  let ln = '<defs><marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#ffb02e"/></marker></defs>';
  const tw = $('#table').offsetWidth || 300, f = (sz / 2 + 3) / tw * 100;
  const seg = (a, b, c) => { const [x1, y1] = pos[a], [x2, y2] = pos[b], L = Math.hypot(x2 - x1, y2 - y1) || 1; return `<line x1="${x1 + (x2 - x1) / L * f}" y1="${y1 + (y2 - y1) / L * f}" x2="${x2 - (x2 - x1) / L * f * 1.5}" y2="${y2 - (y2 - y1) / L * f * 1.5}" stroke="${c}" stroke-width=".8" opacity=".8" marker-end="url(#ar)"/>`; };
  if (v.phase === 'vote') for (const k in votes) { const t = votes[k]; if (t !== 'skip' && pos[k] && pos[t]) ln += seg(Number(k), t, '#ffb02e'); }
  $('#table').querySelectorAll('.seat').forEach(e => e.remove());
  $('#lines').innerHTML = ln;
  $('#table').insertAdjacentHTML('beforeend', h);
}
$('#table').addEventListener('click', e => {

  const v = V, m = v.me, e = $('#p-act'); let h = '';
  const notes = m ? v.private.slice(-3).reverse().map(f => `<div class="note">${esc(f.text)}</div>`).join('') : '';

$('#p-act').addEventListener('click', ev => {

  else if (a === 'nofire') { pend = []; act('action', {target: -1}); }
  else if (a === 'cancel') { pend = []; table(); panelAct(); }
  else if (a === 'confirm') { const p = pend.slice(); pend = []; act('action', m.pick === 2 ? {target: p[0], target2: p[1]} : {target: p[0]}); }
  else if (a === 'vote') { const p = pend.slice(); pend = []; act('vote', {target: p[0]}); }
  else if (a === 'card') openCard(); else if (a === 'end') showEnd();
});

/* chat */
function panelChat() {
  const v = V, m = v.me, e = $('#msgs');
  const ch = m ? m.chat_channel : 'day';
  $('#chs').textContent = !m ? "Kuzatuvchi: chatni faqat o'qiysan" : ({day: '☀️ Umumiy chat', mafia: '🔫 Mafiya chati: faqat mafiya ko\'radi', dead: "👻 O'liklar chati", none: '🌙 Tunda shahar uxlaydi: gapirib bo\'lmaydi'})[ch];
  const ok = !!(m && m.can_chat);
  $('#cf').classList.toggle('off', !ok); $('#ci').disabled = !ok;
  $('#ci').placeholder = ok ? 'Xabar yoz…' : "Hozir yozib bo'lmaydi";
  const sig = v.chat.length + ':' + maxId(v.chat);
  if (sig !== chatSig) {
    chatSig = sig;
    const near = e.scrollHeight - e.scrollTop - e.clientHeight < 70;
    e.innerHTML = v.chat.length ? v.chat.map(c => `<div class="m${m && c.uid === m.uid ? ' me' : ''} ${esc(c.ch)}"><div class="a" style="background:${hue(c.uid)}">${esc([...(c.name || '?')][0] || '?').toUpperCase()}</div><div class="b"><small>${c.ch === 'mafia' ? '🔫 ' : c.ch === 'dead' ? '💀 ' : ''}${esc(c.name)}</small>${esc(c.text)}</div></div>`).join('') : `<div class="mut" style="text-align:center;margin-top:20px">Hali xabar yo'q. Birinchi bo'l 👋</div>`;
    if (near || tab === 'chat') e.scrollTop = e.scrollHeight;
  }
  if (tab !== 'chat' && v.chat.some(c => c.id > seenChat && !(m && c.uid === m.uid))) $('#cd').style.display = 'block';
}
function panelQ() {
  const m = V.me, e = $('#qp'); const ok = !!(m && m.alive && m.can_chat && ['day', 'vote'].includes(V.phase));
  e.style.display = ok ? 'flex' : 'none';
  if (!qpDone) { qpDone = true; QP.forEach(t => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.onclick = () => send(t.replace(/^\S+\s/, '')); e.appendChild(b); }); }
}
async function send(text) {
  const i = $('#ci'), t = (text || i.value).trim(); if (!t || dead) return; if (!text) i.value = '';
  try { const v = await api('chat', {text: t}); if (v.result && !v.result.ok) toast(v.result.msg, true); apply(v, true); } catch (e) { netErr(e); }
}
$('#cf').addEventListener('submit', e => { e.preventDefault(); send(); });

function panelLog() { $('#p-log').innerHTML = `<div class="tl">${V.feed.slice().reverse().map(f => `<div class="${esc(f.kind)}">${ICON[f.kind] || '•'} ${esc(f.text)}</div>`).join('') || '<div class="mut">Hali voqea yo\'q</div>'}</div>`; }
function panelRoles() {
  const mine = V.me && V.me.role, info = Object.entries(V.roles_info || {});
  const grp = (team, cls) => {
    const list = info.filter(([k, r]) => r.team === team);
    if (!list.length) return '';
    return `<div class="rl one">${list.map(([k, r]) => `<div class="rc ${esc(r.team)}${k === mine ? ' mine' : ''}"><b>${r.emoji} ${esc(r.name)}${k === mine ? '<em class="rt">SENING ROLING</em>' : ''}${r.night ? '' : ''}</b><span>${esc(r.desc)}</span></div>`).join('')}</div>`;
  };
  $('#p-roles').innerHTML =
    `<div class="pg-sec"><h4>Qanday o'ynaladi</h4><div class="ph3">
      <div><i>🌙</i><b>Tun</b>Rollar yashirin harakat qiladi</div>
      <div><i>☀️</i><b>Kun</b>Muhokama, gumondorni aytish</div>
      <div><i>🗳</i><b>Ovoz</b>Ko'p ovoz olgan osiladi</div></div></div>
    <div class="pg-sec"><h4>Kim yutadi</h4><div class="pg-win">
      <div><b>🏙 Shahar</b> — barcha mafiya va maniak yo'q qilinsa</div>
      <div class="mafia"><b>🔫 Mafiya</b> — soni qolganlarga teng yoki ko'p bo'lsa</div>
      <div class="maniac"><b>🔪 Maniak</b> — oxirgi tirik qolsa</div></div></div>
    <div class="pg-sec"><h4>🏙 Shahar rollari</h4>${grp('town')}</div>
    <div class="pg-sec"><h4>🔫 Mafiya rollari</h4>${grp('mafia')}</div>
    <div class="pg-sec"><h4>🔪 Yakka</h4>${grp('maniac')}</div>`;
}

/* overlaylar */
function openCard() {
  const m = V && V.me; if (!m || !m.role) return;
  const c = TC[m.team] || 'var(--town)';
  $('#cback').style.setProperty('--c', c);
  $('#cback').innerHTML = `<div class="tm">${esc(m.team_name || '')}</div><div class="em">${m.role_emoji}</div><h2>${esc(m.role_name)}</h2><div style="font-size:13px;color:#d6d2ee">${esc(m.role_desc || '')}</div>${m.team === 'mafia' ? '<div style="margin-top:10px">' + matesHTML() + '</div>' : ''}`;
  $('#card').classList.remove('flip'); $('#ovr').classList.add('on'); hap('medium');
}
$('#card').onclick = () => { const c = $('#card'); if (!c.classList.contains('flip')) { c.classList.add('flip'); hap('heavy'); } else $('#ovr').classList.remove('on'); };
$('#me').onclick = openCard;
function showDead() {
  const m = V && V.me; if (!m) return;
  $('#deadbox').innerHTML = `<div style="font-size:90px">💀</div><div class="big" style="color:var(--mafia)">SEN O'LDING</div><div class="mut" style="margin:0 10px 14px">${m.role_emoji} ${esc(m.role_name)} · endi kuzatuvchisan: hamma rolni ko'rasan va o'liklar chatida gaplashasan.</div><button class="btn alt" id="okd">Davom etish</button>`;
  $('#ovd').classList.add('on'); $('#okd').onclick = () => $('#ovd').classList.remove('on');
}
function showEnd() {
  const v = V; if (!v || v.phase !== 'ended') return;
  const w = v.winner, col = TC[w] || '#fff', mine = v.me && v.me.team === w;
  const rows = v.players.map(p => `<div><span>${p.alive ? '' : '💀 '}${p.is_bot ? '🤖 ' : ''}${esc(p.name)}</span><span style="color:${TC[p.team] || '#fff'}">${p.role_emoji || ''} ${esc(p.role_name || '')}</span></div>`).join('');
  $('#endbox').innerHTML = v.cancelled ? `<div class="big">🛑 Bekor qilindi</div><button class="btn alt" data-x="1">Yopish</button>`
    : `<div class="mut">G'OLIB</div><div class="big" style="color:${col}">${esc(v.winner_name)}</div><div>${v.me ? (mine ? '🏆 Sen yutding!' : 'Bu safar omad kelmadi') : ''}</div><div class="sum">${rows}</div><div class="mut" style="margin-top:8px">Yangi o'yin: guruhda /mafia</div><div class="row"><button class="btn alt" data-x="1">Natijalarni yopish</button>${tg ? '<button class="btn" data-x="2">Chiqish</button>' : ''}</div>`;
  $('#ove').classList.add('on');
  if (!v.cancelled && mine) for (let i = 0; i < 40; i++) { const s = document.createElement('span'); s.className = 'cf'; s.textContent = ['🎉', '✨', '🎊', '⭐'][i % 4]; s.style.left = Math.random() * 100 + 'vw'; s.style.fontSize = 14 + Math.random() * 16 + 'px'; s.style.animationDuration = 2.5 + Math.random() * 2.5 + 's'; s.style.animationDelay = Math.random() * 1.2 + 's'; document.body.appendChild(s); setTimeout(() => s.remove(), 7000); }
}
$('#endbox').addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; if (b.dataset.x === '2' && tg) tg.close(); else $('#ove').classList.remove('on'); });
function profile(u) {
  const v = V, p = byUid(u); if (!p) return;
  const vc = v.votes ? Object.values(v.votes).filter(t => t === u).length : 0;
  const ms = v.chat.filter(c => c.uid === u && c.ch === 'day').slice(-2);
  $('#pbox').innerHTML = `<div class="av" style="background:${hue(u)}">${ini(p)}</div><h3>${esc(p.name)}${p.host ? ' 👑' : ''}</h3><div class="st"><span>${p.alive ? '🟢 Tirik' : "💀 O'lgan"}</span>${p.role ? `<span>${p.role_emoji} ${esc(p.role_name)}</span>` : ''}${v.phase === 'vote' ? `<span>🗳 ${vc} ovoz</span>` : ''}</div>${ms.map(c => `<div class="pm">${esc(c.text)}</div>`).join('')}`;
  $('#ovp').classList.add('on'); hap('light');
}
$('#ovp').onclick = e => { if (e.target === $('#ovp')) $('#ovp').classList.remove('on'); };

/* taymer */
function tick() {
  const v = V; if (!v) return;
  const left = Math.max(0, v.deadline - nowSrv()), run = ['reveal', 'night', 'day', 'vote'].includes(v.phase);
  $('#tnum').textContent = run ? Math.ceil(left) : v.phase === 'ended' ? '🏁' : '👥';
  $('#tlab').textContent = ({lobby: `${v.players.length} o'yinchi`, reveal: "Rolingni ko'r", night: 'Tun', day: 'Muhokama', vote: `Ovoz: ${Object.keys(v.votes || {}).length}/${v.alive_count}`, ended: v.winner_name ? v.winner_name + ' yutdi' : ''})[v.phase] || '';
  const f = run && v.duration ? Math.min(1, left / v.duration) : 1;
  $('#ring .fg').style.strokeDashoffset = 295.3 * (1 - f);
  $('#bar i').style.transform = `scaleX(${f})`;
  const low = run && left <= 10;
  $('#tnum').classList.toggle('pulse', low); $('#bar').classList.toggle('low', low);
  $('#ring .fg').style.stroke = low ? '#ff4d5a' : '';
  const ct = Math.ceil(left); if (run && left <= 5 && ct !== lastTick) { lastTick = ct; snd('tap'); }
  if (JSON.stringify(bubbles()) !== bubSig) table();
}
setInterval(() => V && tick(), 250);

if (!gid) fatal('🔗', "Havola noto'g'ri", "Guruhdagi «Qo'shilish» tugmasi orqali kiring.");
else { poll(); setTimeout(() => $('#splash').classList.add('off'), 1400); }
})();
</script>
