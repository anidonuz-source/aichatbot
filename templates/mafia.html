<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mafia — {{ bot_name }}</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg0:#0a0c13; --bg1:#12162a; --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.09); --txt:#eef0f8; --mut:#9aa0b8; --accent:#8b7cff; --accent2:#c3b8ff;
  --good:#3ddc97; --bad:#ff5d73; --warn:#ffb84d; --r:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--txt);background:var(--bg0);overflow:hidden;
  transition:background 1.2s ease;
}
body::before{content:"";position:fixed;inset:0;z-index:-2;transition:opacity 1.2s ease;opacity:1;
  background:radial-gradient(1200px 700px at 50% -10%,#232a55 0%,transparent 60%),linear-gradient(180deg,#0a0c13,#0d1020);}
body[data-phase="night"]::before{background:radial-gradient(900px 600px at 80% -5%,#2a2f78 0%,transparent 55%),radial-gradient(700px 500px at 0% 100%,#161a40 0%,transparent 60%),linear-gradient(180deg,#05060d,#0a0d22);}
body[data-phase="day"]::before{background:radial-gradient(900px 600px at 50% -10%,#6b4a23 0%,transparent 60%),linear-gradient(180deg,#171320,#241b24);}
body[data-phase="vote"]::before{background:radial-gradient(900px 600px at 50% -10%,#6a2236 0%,transparent 60%),linear-gradient(180deg,#140c14,#1f101a);}
body[data-phase="ended"]::before{background:radial-gradient(900px 600px at 50% -10%,#2f3f78 0%,transparent 60%),linear-gradient(180deg,#0a0c13,#111631);}
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.2s;
  background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 40% 70%,#cfd6ff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),
  radial-gradient(1px 1px at 10% 85%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 50%,#fff,transparent);
  animation:tw 4s ease-in-out infinite alternate}
body[data-phase="night"] .stars{opacity:.9}
@keyframes tw{from{opacity:.45}to{opacity:.95}}

#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-t)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
.hicon{width:46px;height:46px;border-radius:15px;background:var(--card2);display:grid;place-items:center;font-size:24px;border:1px solid var(--line)}
.htxt{flex:1;min-width:0}
.htitle{font-weight:750;font-size:17px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:12.5px;color:var(--mut);margin-top:2px}
.ring{position:relative;width:48px;height:48px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:rgba(255,255,255,.12)} .ring .fg{stroke:var(--accent2);transition:stroke-dashoffset .25s linear,stroke .3s}
.ring.low .fg{stroke:var(--bad)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.chip{margin:0 16px 8px;display:flex;gap:8px;align-items:center}
.rolechip{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer}
.rolechip.dead{opacity:.7}
.tag{font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.tag.red{color:#ffb3bd;background:rgba(255,93,115,.12);border-color:rgba(255,93,115,.3)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:4px 16px 24px;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}
#view-chat.on{display:flex;flex-direction:column;padding-bottom:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:10px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 6px;font-size:15.5px}
.card p{margin:4px 0;color:var(--mut);font-size:13.5px;line-height:1.45}
.hero{text-align:center;padding:22px 16px}
.hero .big{font-size:46px;line-height:1;margin-bottom:8px}
.hero h2{margin:4px 0 4px;font-size:21px}
.sec{margin:16px 2px 4px;font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);font-weight:700}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:420px){.grid{grid-template-columns:repeat(3,1fr)}}
.pc{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 8px 10px;text-align:center;transition:transform .15s,border-color .2s,background .2s;animation:rise .3s ease both}
.pc.sel{cursor:pointer}
.pc.sel:active{transform:scale(.97)}
.pc.pick{border-color:var(--accent);background:rgba(139,124,255,.16);box-shadow:0 0 0 3px rgba(139,124,255,.18)}
.pc.done{border-color:var(--good);background:rgba(61,220,151,.12)}
.pc.off{opacity:.42}
.pc.dead .av{filter:grayscale(1);opacity:.6}
.pc.dead .nm{text-decoration:line-through;color:var(--mut)}
.av{width:48px;height:48px;border-radius:50%;margin:0 auto 7px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.15)}
.av.sm{width:22px;height:22px;font-size:11px;margin:0;border-width:1px}
.nm{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl{font-size:11.5px;color:var(--accent2);margin-top:3px;min-height:15px}
.badge{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;background:var(--bad);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 8px rgba(255,93,115,.5)}
.host{position:absolute;top:6px;left:8px;font-size:13px}
.voters{display:flex;justify-content:center;gap:3px;margin-top:6px;min-height:22px;flex-wrap:wrap}

.btn{appearance:none;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:13px 18px;border-radius:14px;width:100%;cursor:pointer;transition:transform .12s,opacity .2s,filter .2s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}
.btn.good{background:var(--good);color:#06281a}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}

#bar{position:fixed;left:0;right:0;bottom:calc(60px + var(--safe-b));padding:10px 16px;background:linear-gradient(180deg,transparent,rgba(8,10,20,.92) 40%);display:none;z-index:5}
#bar.on{display:block;animation:rise .25s ease both}
#bar .row{max-width:640px;margin:0 auto}

nav{display:flex;border-top:1px solid var(--line);background:rgba(8,10,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-bottom:var(--safe-b)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 9px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;cursor:pointer}
nav button i{font-style:normal;font-size:20px}
nav button.on{color:var(--txt)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2.5px;border-radius:2px;background:var(--accent)}
nav .dot{position:absolute;top:5px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;font-weight:800;min-width:17px;height:17px;display:none;place-items:center;padding:0 4px}
nav .dot.on{display:grid}

.chatlist{flex:1;overflow-y:auto;padding:6px 0 10px;display:flex;flex-direction:column;gap:7px}
.msg{max-width:82%;padding:8px 12px;border-radius:16px 16px 16px 5px;background:var(--card2);border:1px solid var(--line);font-size:14px;line-height:1.4;word-wrap:break-word;overflow-wrap:anywhere;animation:rise .2s ease both}
.msg .who{font-size:11.5px;font-weight:750;margin-bottom:2px}
.msg.me{align-self:flex-end;border-radius:16px 16px 5px 16px;background:rgba(139,124,255,.28);border-color:rgba(139,124,255,.45)}
.msg.mafia{background:rgba(255,93,115,.14);border-color:rgba(255,93,115,.35)}
.msg.dead{background:rgba(255,255,255,.04);color:var(--mut);font-style:italic}
.chstrip{font-size:12px;color:var(--mut);padding:6px 2px;display:flex;align-items:center;gap:6px}
.chform{display:flex;gap:8px;padding:8px 0 calc(8px);border-top:1px solid var(--line);background:transparent}
.chform input{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:12px 14px;font-size:15px;outline:none}
.chform input:focus{border-color:var(--accent)}
.chform button{width:48px;border-radius:14px;border:0;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
.chform.off{opacity:.45;pointer-events:none}

.feed{display:flex;flex-direction:column;gap:8px}
.fi{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:13.5px;line-height:1.4}
.fi i{font-style:normal;font-size:18px;line-height:1.2}
.fi small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.priv{border-left:3px solid var(--warn)}

#overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(4,5,12,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#overlay.on{display:flex;animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:380px;text-align:center}
.flip{perspective:1000px;margin:0 auto 18px;width:230px;height:320px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;border:1.5px solid rgba(255,255,255,.18);box-shadow:0 20px 60px rgba(0,0,0,.55)}
.face.f{background:linear-gradient(160deg,#2b2f66,#14173a);}
.face.f span{font-size:78px;opacity:.9}
.face.b{transform:rotateY(180deg);background:linear-gradient(160deg,#3a2f77,#171a42)}
.face.b.mafia{background:linear-gradient(160deg,#7a1f33,#2a0d18)}
.face.b.maniac{background:linear-gradient(160deg,#6b3a14,#27140a)}
.face.b .e{font-size:76px;margin-bottom:10px}
.face.b h2{margin:0 0 6px;font-size:24px}
.face.b p{margin:0;font-size:13px;color:#d8daf0;line-height:1.45}
.hint{color:var(--mut);font-size:13px;margin:0 0 14px}
.win{font-size:56px}
.rtable{text-align:left;margin:14px 0;display:flex;flex-direction:column;gap:7px;max-height:42vh;overflow-y:auto}
.rr{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.rr .r{margin-left:auto;color:var(--accent2);font-size:13px}
.rr.d{opacity:.6}

#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-140%);z-index:40;max-width:90%;background:#1d2140;border:1px solid var(--line);padding:11px 16px;border-radius:14px;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.3,.9,.3,1);text-align:center}
#toast.on{transform:translate(-50%,0)}
.full{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;z-index:50;background:var(--bg0)}
.moon{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.sleep{padding:34px 16px}
.sleep .big{font-size:64px}

/* rollar bo'limi */
.ph3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph3>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 6px;text-align:center;font-size:11px;color:var(--mut);line-height:1.35}
.ph3 b{display:block;font-size:13px;color:var(--txt);margin:3px 0}.ph3 i{font-style:normal;font-size:22px}
.wn{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:13px;color:var(--mut)}
.wn.mafia{border-left-color:var(--bad)}.wn.maniac{border-left-color:var(--warn)}.wn b{color:var(--txt)}
.rolebox{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--good);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.rolebox.mafia{border-top-color:var(--bad)}.rolebox.maniac{border-top-color:var(--warn)}.rolebox.mine{outline:2px solid var(--accent2)}
.rolebox b{display:block;font-size:14px}.rolebox span{font-size:12.5px;color:var(--mut);line-height:1.45}
.rolebox em{font-style:normal;font-size:10px;font-weight:800;color:var(--warn);margin-left:6px}
</style>
</head>
<body data-phase="lobby">
<div class="stars"></div>
<div id="app">
  <header>
    <div class="hicon" id="hicon">🎭</div>
    <div class="htxt"><div class="htitle" id="htitle">Mafia</div><div class="hsub" id="hsub">Yuklanmoqda…</div></div>
    <div class="ring" id="ring" style="display:none">
      <svg width="48" height="48" viewBox="0 0 48 48"><circle class="bg" cx="24" cy="24" r="20" fill="none" stroke-width="4"/><circle class="fg" id="rfg" cx="24" cy="24" r="20" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="0"/></svg>
      <b id="rtxt">0</b>
    </div>
  </header>
  <div class="chip" id="chip"></div>
  <main>
    <section class="view on" id="view-game"></section>
    <section class="view" id="view-chat">
      <div class="chstrip" id="chstrip"></div>
      <div class="chatlist" id="chatlist"></div>
      <form class="chform" id="chform" autocomplete="off"><input id="chinput" maxlength="220" placeholder="Xabar yoz…" enterkeyhint="send"><button type="submit">➤</button></form>
    </section>
    <section class="view" id="view-log"></section>
    <section class="view" id="view-roles"></section>
  </main>
  <div id="bar"></div>
  <nav>
    <button data-tab="game" class="on"><i>🎮</i>O'yin</button>
    <button data-tab="chat"><i>💬</i>Chat<span class="dot" id="cdot">0</span></button>
    <button data-tab="log"><i>📜</i>Jurnal</button>
    <button data-tab="roles"><i>🎭</i>Rollar</button>
  </nav>
</div>
<div id="overlay"></div>
<div id="toast"></div>

{% raw %}
<script>
(() => {
'use strict';
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor('#0a0c13'); tg.setBackgroundColor('#0a0c13'); } catch (e) {}
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gid = new URLSearchParams(location.search).get('g') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
const hap = (t, k) => { try { if (!tg || !tg.HapticFeedback) return; t === 'n' ? tg.HapticFeedback.notificationOccurred(k || 'success') : tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} };

let S = null, offset = 0, tab = 'game', pending = null, pending2 = null, unread = 0, firstLoad = true;
let seenPriv = new Set(), lastChatSig = '', revealDismissed = '', endDismissed = false, lastPhaseKey = '', wasAlive = null, busy = false;

const hue = uid => (Math.abs(Number(uid) * 47) + 20) % 360;
const avBg = uid => `linear-gradient(135deg,hsl(${hue(uid)} 70% 52%),hsl(${(hue(uid) + 40) % 360} 65% 38%))`;
function av(p, cls = '') {
  const ch = p.is_bot ? '🤖' : esc((p.name || '?').trim().charAt(0).toUpperCase());
  return `<div class="av ${cls}" style="background:${avBg(p.uid)}">${ch}</div>`;
}
const byUid = uid => S && S.players.find(p => p.uid === uid);
const nowSrv = () => Date.now() / 1000 + offset;

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function fullMsg(icon, title, text) {
  document.body.insertAdjacentHTML('beforeend', `<div class="full"><div><div style="font-size:60px">${icon}</div><h2>${esc(title)}</h2><p class="hint">${esc(text)}</p></div></div>`);
}

async function api(path, extra) {
  const r = await fetch('/api/mafia/' + path, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(Object.assign({initData: tg ? tg.initData : '', gid}, extra || {})),
  });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || 'http'); err.status = r.status; err.code = j.error; throw err; }
  return j;
}
async function act(path, extra, okToast) {
  if (busy) return; busy = true;
  try {
    const j = await api(path, extra);
    apply(j);
    if (j.result && !j.result.ok) { toast(j.result.msg); hap('n', 'error'); }
    else if (okToast) { toast(okToast); hap('n', 'success'); }
  } catch (e) { toast('Ulanishda xatolik, qayta urin'); }
  finally { busy = false; }
}

// ── polling ────────────────────────────────────────────────────────────
let dead = false;
async function poll() {
  if (dead) return;
  try { apply(await api('state')); }
  catch (e) {
    if (e.status === 401) { dead = true; fullMsg('✈️', "Telegram ichida oching", "Bu sahifa faqat Telegram Mini App sifatida ishlaydi."); return; }
    if (e.status === 404) { dead = true; fullMsg('🕳', "O'yin topilmadi", "O'yin tugagan yoki havola eskirgan. Guruhda /mafia deb yangisini oching."); return; }
  }
  setTimeout(poll, S && ['night', 'day', 'vote'].includes(S.phase) ? 1000 : 1500);
}
function apply(j) {
  offset = j.now - Date.now() / 1000;
  const changed = !S || j.version !== S.version || j.phase !== S.phase;
  S = j;
  if (changed || firstLoad) { render(); firstLoad = false; }
  tickTimer();
}

// ── render ─────────────────────────────────────────────────────────────
function render() {
  const key = S.phase + ':' + S.day;
  if (key !== lastPhaseKey) { pending = null; pending2 = null; lastPhaseKey = key; if (!firstLoad) hap('n', 'warning'); }
  document.body.dataset.phase = S.phase;
  renderHeader(); renderGame(); renderChat(); renderLog(); renderRoles(); renderBar(); renderOverlay(); notify();
}

function renderHeader() {
  const icons = {lobby: '🎭', reveal: '🃏', night: '🌙', day: '☀️', vote: '🗳', ended: '🏁'};
  $('#hicon').textContent = icons[S.phase] || '🎭';
  let title = 'Mafia', sub = '';
  if (S.phase === 'lobby') { title = 'Mafia lobbisi'; sub = `${S.players.length}/${S.max_players} o'yinchi` + (S.chat_title ? ' · ' + S.chat_title : ''); }
  else if (S.phase === 'reveal') { title = 'Rollar tarqatildi'; sub = 'Rolingni ko‘r va tayyorlan'; }
  else if (S.phase === 'night') { title = `${S.day}-tun`; sub = `Tirik: ${S.alive_count} / ${S.players.length}`; }
  else if (S.phase === 'day') { title = `${S.day}-kun · Muhokama`; sub = `Tirik: ${S.alive_count} / ${S.players.length}`; }
  else if (S.phase === 'vote') { title = `${S.day}-kun · Ovoz berish`; sub = `Tirik: ${S.alive_count} / ${S.players.length}`; }
  else { title = S.cancelled ? "O'yin bekor qilindi" : "O'yin tugadi"; sub = S.winner_name ? `G'olib: ${S.winner_name}` : ''; }
  $('#htitle').textContent = title; $('#hsub').textContent = sub;
  $('#ring').style.display = ['reveal', 'night', 'day', 'vote'].includes(S.phase) ? '' : 'none';

  const me = S.me; let chip = '';
  if (me && me.role) {
    chip = `<div class="rolechip ${me.alive ? '' : 'dead'}" id="rolechip">${me.role_emoji} ${esc(me.role_name)}<span style="color:var(--mut);font-weight:500">· ${esc(me.team_name || '')}</span></div>`;
    if (!me.alive) chip += `<span class="tag red">💀 O'lgan</span>`;
    else if (S.phase === 'day' && me.ready) chip += `<span class="tag">✓ Tayyor</span>`;
  }
  $('#chip').innerHTML = chip;
  const rc = $('#rolechip'); if (rc) rc.onclick = () => showRole(false);
}

function pcard(p, o = {}) {
  const sel = o.selectable, cls = ['pc'];
  if (sel) cls.push('sel'); if (o.picked) cls.push('pick'); if (o.done) cls.push('done');
  if (o.off) cls.push('off'); if (!p.alive) cls.push('dead');
  const role = p.role ? `${p.role_emoji} ${esc(p.role_name)}` : (p.alive ? '' : '💀');
  const badge = o.tally ? `<div class="badge">${o.tally}</div>` : '';
  const voters = o.voters && o.voters.length ? `<div class="voters">${o.voters.map(v => av(v, 'sm')).join('')}</div>` : '';
  return `<div class="${cls.join(' ')}" data-uid="${p.uid}">${p.host ? '<span class="host">👑</span>' : ''}${badge}${av(p)}<div class="nm">${esc(p.name)}</div><div class="rl">${role}</div>${voters}</div>`;
}

function privBlock() {
  const items = (S.me && S.private || []).slice(-4);
  if (!items.length) return '';
  return `<div class="sec">Maxfiy xabarlar</div><div class="feed">${items.reverse().map(m => `<div class="fi priv"><span>${esc(m.text)}</span></div>`).join('')}</div>`;
}

function renderGame() {
  const v = $('#view-game'), me = S.me, ph = S.phase; let h = '';
  const inGame = !!me;
  if (ph === 'lobby') {
    h += `<div class="card hero"><div class="big moon">🎭</div><h2>MAFIA</h2><p>${S.players.length} / ${S.max_players} o'yinchi · kamida ${S.min_players} kerak</p></div>`;
    h += `<div class="sec">O'yinchilar</div><div class="grid">${S.players.map(p => pcard(p)).join('')}</div>`;
    h += `<div class="card"><h3>Qanday o'ynaladi?</h3><p>Tunda rollar yashirin harakat qiladi, kunduzi hamma muhokama qilib, bitta gumonlini osadi. Shahar mafiyani topsa yutadi, mafiya shaharni qirsa — o'zi.</p></div>`;
    h += `<div class="sec">Rollar</div>` + Object.values(S.roles_info).map(r => `<div class="fi"><i>${r.emoji}</i><div><b>${esc(r.name)}</b><small>${esc(r.desc)}</small></div></div>`).join('<div style="height:8px"></div>');
    h += '<div style="height:110px"></div>';
  } else if (ph === 'reveal') {
    h += `<div class="card hero"><div class="big moon">🃏</div><h2>Rollar tarqatildi</h2><p>Birozdan so'ng tun tushadi. Rolingni eslab qol va jim tur.</p></div>`;
    h += `<div class="grid">${S.players.map(p => pcard(p)).join('')}</div>`;
  } else if (ph === 'night') {
    if (!me) h += `<div class="card hero"><div class="big moon">🌙</div><h2>Kuzatuvchi</h2><p>Sen bu o'yinda o'yinchi emassan.</p></div>`;
    else if (!me.alive) h += `<div class="card hero"><div class="big">👻</div><h2>Sen o'ldingiz</h2><p>Kuzatuvchisan: hamma rollarni ko'rasan, faqat o'liklar chatida gaplasha olasan.</p></div><div class="grid">${S.players.map(p => pcard(p)).join('')}</div>`;
    else if (me.action) {
      const hints = {kill: "Mafiya jamoasi bilan kelishib, bitta o'yinchini tanla (ovozlar teng bo'lsa Don hal qiladi).", slay: "Bu tun kimni o'ldirasan?", check: "Kimni tekshiramiz? Natija ertalab sirli xabar bo'lib keladi.", heal: "Kimni davolaysan? Ketma-ket bir odamni emas, o'zingni — 1 marta.", guard: "Kimni qo'riqlaysan? Unga hujum bo'lsa, o'rniga sen o'lasan.", block: "Kimni band qilasan? U bu tun harakat qila olmaydi.", compare: "Ikki o'yinchini tanla: ular bir jamoadami yoki yo'qmi, bilasan.", snipe: "Kimni otasan? Begunohni otsang, o'zing ham o'lasan. Ishonching komil bo'lmasa, pastdagi «O'q uzmaslik» ni bos.", defend: "Qaysi mafiyachini himoya qilasan? Komissar unga «tinch» deb ko'radi."};
      h += `<div class="card"><h3>${me.role_emoji} ${esc(me.action_label)}</h3><p>${hints[me.action] || ''}</p>${me.team === 'mafia' ? mafiaMates() : ''}</div>`;
      h += `<div class="grid">${S.players.filter(p => p.alive).map(p => {
        const ok = me.targets.includes(p.uid);
        return pcard(p, {selectable: ok, off: !ok, picked: pending === p.uid || pending2 === p.uid, done: me.my_target === p.uid || me.my_target2 === p.uid});
      }).join('')}</div>`;
      if (me.action === 'snipe') h += `<div class="card"><p>Qolgan o'q: <b>${me.shots}</b>${me.my_pass ? ' · ✓ bu tun o\'q uzmaslik tanlandi' : ''}</p></div>`;
      if (me.my_target != null) h += `<div class="card" style="border-color:var(--good)"><p>✓ Tanlov qabul qilindi: <b>${esc((byUid(me.my_target) || {}).name || '')}${me.my_target2 != null ? ' va ' + esc((byUid(me.my_target2) || {}).name || '') : ''}</b>. Vaqt tugaguncha o'zgartirishing mumkin.</p></div>`;
      h += '<div style="height:90px"></div>';
    } else {
      h += `<div class="card hero sleep"><div class="big moon">😴</div><h2>Shahar uxlaydi</h2><p>Sening rolingda tungi harakat yo'q. Ko'zingni yum va tong otishini kut.</p></div>`;
      h += `<div class="grid">${S.players.filter(p => p.alive).map(p => pcard(p)).join('')}</div>`;
    }
    h += privBlock();
  } else if (ph === 'day') {
    const lastNews = S.feed.filter(f => f.day === S.day && ['death', 'lynch'].includes(f.kind)).slice(-3);
    const news = lastNews.length ? lastNews.map(f => `<div class="fi"><i>☠️</i><span>${esc(f.text)}</span></div>`).join('') : `<div class="fi"><i>🌤</i><span>Bu tun hech kim o'lmadi.</span></div>`;
    h += `<div class="sec">Tong yangiliklari</div><div class="feed">${news}</div>`;
    h += `<div class="card"><h3>Muhokama</h3><p>Chat bo'limida gaplash: kim shubhali? Tayyor bo'lsang «Ovozga tayyorman» ni bos, yarmidan ko'pi tayyor bo'lsa ovoz berish boshlanadi (${S.ready_count}/${Math.floor(S.alive_count / 2) + 1}).</p></div>`;
    h += `<div class="sec">O'yinchilar</div><div class="grid">${S.players.map(p => pcard(p)).join('')}</div>`;
    h += privBlock(); h += '<div style="height:90px"></div>';
  } else if (ph === 'vote') {
    const votes = S.votes || {}, tally = {}, voters = {}; let skips = 0, cast = 0;
    Object.keys(votes).forEach(k => { cast++; const t = votes[k]; if (t === 'skip') { skips++; return; } tally[t] = (tally[t] || 0) + 1; (voters[t] = voters[t] || []).push(byUid(Number(k)) || {uid: Number(k), name: '?'}); });
    h += `<div class="card"><h3>🗳 Kimni osamiz?</h3><p>Ovoz berganlar: ${cast}/${S.alive_count}. Eng ko'p ovoz olgan osiladi; teng bo'lsa yoki «o'tkazib yuborish» ko'p bo'lsa — hech kim.</p></div>`;
    h += `<div class="grid">${S.players.filter(p => p.alive).map(p => {
      const ok = me && me.alive && me.targets.includes(p.uid);
      return pcard(p, {selectable: ok, off: !!(me && me.alive && p.uid === me.uid), picked: pending === p.uid, done: me && me.my_vote === p.uid, tally: tally[p.uid] || 0, voters: voters[p.uid]});
    }).join('')}</div>`;
    h += `<div class="card"><p>⏭ O'tkazib yuborish: <b>${skips}</b></p></div>`;
    if (me && !me.alive) h += `<div class="card"><p>👻 O'lganlar ovoz bera olmaydi.</p></div>`;
    h += privBlock(); h += '<div style="height:100px"></div>';
  } else {
    const wn = S.winner;
    const ico = wn === 'town' ? '🏙' : wn === 'mafia' ? '🔫' : wn === 'maniac' ? '🔪' : '🛑';
    h += `<div class="card hero"><div class="win">${ico}</div><h2>${S.cancelled ? "O'yin bekor qilindi" : esc(S.winner_name) + ' g‘alaba qildi!'}</h2></div>`;
    h += `<div class="sec">Hamma rollar</div><div class="rtable">${S.players.map(p => `<div class="rr ${p.alive ? '' : 'd'}">${av(p, 'sm')}<span>${esc(p.name)}</span><span class="r">${p.role ? p.role_emoji + ' ' + esc(p.role_name) : ''}${p.alive ? '' : ' 💀'}</span></div>`).join('')}</div>`;
    h += `<div class="card"><p>Yana o'ynash uchun guruhda /mafia yozing.</p></div>`;
  }
  v.innerHTML = h;
  v.querySelectorAll('.pc.sel').forEach(el => el.onclick = () => {
    const u = Number(el.dataset.uid), two = S.phase === 'night' && S.me && S.me.pick === 2;
    if (two) {
      if (pending === u) { pending = pending2; pending2 = null; }
      else if (pending2 === u) pending2 = null;
      else if (pending == null) pending = u;
      else if (pending2 == null) pending2 = u;
      else { pending = u; pending2 = null; }
    } else { pending = u; pending2 = null; }
    hap('l'); renderGame(); renderBar();
  });
}
function mafiaMates() {
  const m = S.players.filter(p => p.team === 'mafia' && p.uid !== S.me.uid);
  return m.length ? `<p>🔫 Jamoang: <b>${m.map(p => esc(p.name) + (p.role === 'don' ? ' 🎩' : '')).join(', ')}</b></p>` : '';
}

function renderBar() {
  const bar = $('#bar'), me = S.me; let h = '';
  if (S.phase === 'lobby') {
    if (!me) h = `<div class="row"><button class="btn good" data-a="join">🎮 Qo'shilish</button></div>`;
    else if (S.is_host) {
      h = `<div class="row">${S.bot_count < S.max_bots ? `<button class="btn ghost" data-a="addbot">🤖 Bot + (${S.bot_count})</button>` : ''}${S.bot_count ? `<button class="btn ghost" data-a="removebot">🤖 Bot −</button>` : ''}<button class="btn good" data-a="start" ${S.players.length >= S.min_players ? '' : 'disabled'}>▶️ Boshlash (${S.players.length})</button></div>`;
    } else h = `<div class="row"><button class="btn ghost" data-a="leave">Chiqish</button></div>`;
  } else if (S.phase === 'night' && me && me.alive && me.action && pending != null && (me.pick !== 2 || pending2 != null)) {
    const t = byUid(pending), t2 = pending2 != null ? byUid(pending2) : null;
    h = `<div class="row"><button class="btn ghost" data-a="cancelpick">Bekor</button><button class="btn ${['kill', 'slay'].includes(me.action) ? 'bad' : ''}" data-a="confirm">${esc(me.action_label)}: ${esc(t ? t.name : '')}${t2 ? ' + ' + esc(t2.name) : ''}</button></div>`;
  } else if (S.phase === 'night' && me && me.alive && me.can_skip && !me.my_pass) {
    h = `<div class="row"><button class="btn ghost" data-a="nofire">🚫 O'q uzmaslik</button></div>`;
  } else if (S.phase === 'day' && me && me.alive && !me.ready) {
    h = `<div class="row"><button class="btn" data-a="ready">✋ Ovozga tayyorman</button></div>`;
  } else if (S.phase === 'vote' && me && me.alive) {
    if (pending != null && pending !== me.my_vote) { const t = byUid(pending); h = `<div class="row"><button class="btn ghost" data-a="cancelpick">Bekor</button><button class="btn bad" data-a="votego">Ovoz: ${esc(t ? t.name : '')}</button></div>`; }
    else h = `<div class="row"><button class="btn ghost" data-a="skip">⏭ O'tkazib yuborish</button></div>`;
  } else if (S.phase === 'ended') {
    h = `<div class="row"><button class="btn ghost" data-a="close">Yopish</button></div>`;
  }
  bar.innerHTML = h; bar.classList.toggle('on', !!h && tab === 'game');
  bar.querySelectorAll('[data-a]').forEach(b => b.onclick = () => barAction(b.dataset.a));
}
function barAction(a) {
  if (a === 'join') act('join', {}, "Qo'shilding");
  else if (a === 'leave') act('leave', {}, 'Chiqding');
  else if (a === 'addbot') act('addbot', {}, "Misumi qo'shildi 🤖");
  else if (a === 'start') act('start', {});
  else if (a === 'confirm') { const t = pending, t2 = pending2; act('action', S.me.pick === 2 ? {target: t, target2: t2} : {target: t}, 'Tanlov qabul qilindi'); pending = null; pending2 = null; }
  else if (a === 'removebot') act('removebot', {}, 'Bot olib tashlandi')
  else if (a === 'nofire') { pending = null; pending2 = null; act('action', {target: -1}, "O'q uzilmaydi"); }
  else if (a === 'votego') { const t = pending; act('vote', {target: t}, 'Ovoz berildi'); pending = null; }
  else if (a === 'skip') { pending = null; act('vote', {target: 'skip'}, "O'tkazib yubording"); }
  else if (a === 'ready') act('ready', {}, 'Tayyor ✓');
  else if (a === 'cancelpick') { pending = null; pending2 = null; renderGame(); renderBar(); }
  else if (a === 'close') { if (tg) tg.close(); }
}

// ── chat ───────────────────────────────────────────────────────────────
function renderChat() {
  const list = $('#chatlist'), me = S.me;
  const ch = me ? me.chat_channel : 'none';
  const labels = {day: '☀️ Umumiy chat', mafia: '🔫 Mafiya chati — faqat mafiya ko‘radi', dead: '👻 O‘liklar chati', none: '🌙 Tunda shahar uxlaydi — gapirib bo‘lmaydi'};
  $('#chstrip').textContent = me ? labels[ch] : 'Kuzatuvchi — chatni faqat o‘qiysan';
  const form = $('#chform'); const canWrite = !!(me && me.can_chat);
  form.classList.toggle('off', !canWrite); $('#chinput').disabled = !canWrite;
  $('#chinput').placeholder = canWrite ? 'Xabar yoz…' : 'Hozir yozib bo‘lmaydi';
  const sig = S.chat.length + ':' + (S.chat.length ? S.chat[S.chat.length - 1].id : 0);
  if (sig === lastChatSig) return;
  const prevIds = new Set(Array.from(list.children).map(c => c.dataset.id));
  const near = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
  list.innerHTML = S.chat.length ? S.chat.map(m => {
    const mine = me && m.uid === me.uid;
    const c = `hsl(${hue(m.uid)} 80% 72%)`;
    return `<div class="msg ${mine ? 'me' : ''} ${m.ch === 'mafia' ? 'mafia' : ''} ${m.ch === 'dead' ? 'dead' : ''}" data-id="${m.id}">${mine ? '' : `<div class="who" style="color:${c}">${esc(m.name)}${m.ch === 'mafia' ? ' 🔫' : m.ch === 'dead' ? ' 👻' : ''}</div>`}${esc(m.text)}</div>`;
  }).join('') : `<div class="hint" style="text-align:center;margin-top:30px">Hali xabar yo'q. Birinchi bo'l 👋</div>`;
  const fresh = S.chat.filter(m => !prevIds.has(String(m.id)) && !(me && m.uid === me.uid));
  if (tab !== 'chat' && lastChatSig !== '' && fresh.length) { unread += fresh.length; updDot(); }
  lastChatSig = sig;
  if (near || tab !== 'chat' || prevIds.size === 0) list.scrollTop = list.scrollHeight;
}
function updDot() { const d = $('#cdot'); d.textContent = unread > 99 ? '99+' : unread; d.classList.toggle('on', unread > 0); }
$('#chform').addEventListener('submit', async e => {
  e.preventDefault();
  const inp = $('#chinput'), text = inp.value.trim(); if (!text) return;
  inp.value = '';
  try { const j = await api('chat', {text}); apply(j); if (j.result && !j.result.ok) toast(j.result.msg); } catch (err) { toast('Yuborilmadi'); }
  inp.focus();
});

// ── jurnal ─────────────────────────────────────────────────────────────
function renderLog() {
  const icons = {start: '🎭', night: '🌙', death: '☠️', lynch: '⚖️', vote: '🗳', end: '🏁', info: '•'};
  $('#view-log').innerHTML = `<div class="sec">O'yin jurnali</div><div class="feed">${S.feed.slice().reverse().map(f => `<div class="fi"><i>${icons[f.kind] || '•'}</i><div>${esc(f.text)}<small>${f.day ? f.day + '-davr' : ''}</small></div></div>`).join('') || '<p class="hint">Hali hech narsa bo‘lmadi.</p>'}</div>`;
}


// ── rollar ─────────────────────────────────────────────────────────────
function renderRoles() {
  const mine = S.me && S.me.role, info = Object.entries(S.roles_info || {});
  const grp = team => info.filter(([k, r]) => r.team === team).map(([k, r]) =>
    `<div class="rolebox ${esc(r.team)} ${k === mine ? 'mine' : ''}"><b>${r.emoji} ${esc(r.name)}${k === mine ? '<em>SENING ROLING</em>' : ''}</b><span>${esc(r.desc)}</span></div>`).join('');
  $('#view-roles').innerHTML =
    `<div class="sec">Qanday o'ynaladi</div><div class="ph3"><div><i>🌙</i><b>Tun</b>Rollar yashirin harakat qiladi</div><div><i>☀️</i><b>Kun</b>Muhokama, gumondorni aytish</div><div><i>🗳</i><b>Ovoz</b>Ko'p ovoz olgan osiladi</div></div>` +
    `<div class="sec">Kim yutadi</div><div class="wn"><b>🏙 Shahar</b> — barcha mafiya va maniak yo'q qilinsa</div><div class="wn mafia"><b>🔫 Mafiya</b> — soni qolganlarga teng yoki ko'p bo'lsa</div><div class="wn maniac"><b>🔪 Maniak</b> — oxirgi tirik qolsa</div>` +
    `<div class="sec">🏙 Shahar rollari</div>${grp('town')}<div class="sec">🔫 Mafiya rollari</div>${grp('mafia')}<div class="sec">🔪 Yakka</div>${grp('maniac')}<div style="height:20px"></div>`;
}

// ── overlay: rol kartasi, yakun ────────────────────────────────────────
function showRole(auto) {
  const me = S.me; if (!me || !me.role) return;
  const o = $('#overlay'); const team = me.team === 'mafia' ? 'mafia' : me.team === 'maniac' ? 'maniac' : '';
  const mates = me.team === 'mafia' ? mafiaMates() : '';
  o.innerHTML = `<div class="modal"><div class="flip ${auto ? '' : 'on'}" id="flip"><div class="in"><div class="face f"><span>🃏</span><p class="hint" style="margin-top:14px">Ochish uchun bos</p></div><div class="face b ${team}"><div class="e">${me.role_emoji}</div><h2>${esc(me.role_name)}</h2><p>${esc(me.role_desc)}</p></div></div></div>${mates ? `<div style="margin-bottom:12px">${mates}</div>` : ''}<button class="btn" id="okrole">Tushundim</button></div>`;
  o.classList.add('on');
  $('#flip').onclick = () => { $('#flip').classList.add('on'); hap('n', 'success'); };
  $('#okrole').onclick = () => { o.classList.remove('on'); if (auto) revealDismissed = gid; };
}
function renderOverlay() {
  const o = $('#overlay');
  if (S.phase === 'reveal' && S.me && S.me.role && revealDismissed !== gid) {
    if (!o.classList.contains('on')) showRole(true);
  } else if (S.phase === 'ended' && !S.cancelled && S.winner && !endDismissed) {
    const ico = S.winner === 'town' ? '🏙' : S.winner === 'mafia' ? '🔫' : '🔪';
    o.innerHTML = `<div class="modal"><div class="win">${ico}</div><h2 style="margin:8px 0">${esc(S.winner_name)} g‘alaba qildi!</h2><div class="rtable">${S.players.map(p => `<div class="rr ${p.alive ? '' : 'd'}">${av(p, 'sm')}<span>${esc(p.name)}</span><span class="r">${p.role ? p.role_emoji + ' ' + esc(p.role_name) : ''}${p.alive ? '' : ' 💀'}</span></div>`).join('')}</div><button class="btn" id="okend">Davom etish</button></div>`;
    o.classList.add('on'); hap('n', 'success');
    $('#okend').onclick = () => { endDismissed = true; o.classList.remove('on'); };
  } else if (S.phase !== 'reveal' && o.classList.contains('on') && !S.me) {
    o.classList.remove('on');
  }
  if (S.phase === 'night' && o.classList.contains('on') && o.querySelector('#flip')) o.classList.remove('on');
}

// ── bildirishnomalar ───────────────────────────────────────────────────
function notify() {
  if (S.me) {
    (S.private || []).forEach(m => { if (!seenPriv.has(m.id)) { seenPriv.add(m.id); if (!firstLoad) { toast(m.text, 4200); hap('n', m.kind === 'death' ? 'error' : 'success'); } } });
    if (wasAlive === true && !S.me.alive) hap('n', 'error');
    wasAlive = S.me.alive;
  }
}

// ── taymer ─────────────────────────────────────────────────────────────
function tickTimer() {
  if (!S || !['reveal', 'night', 'day', 'vote'].includes(S.phase)) return;
  const left = Math.max(0, S.deadline - nowSrv());
  const frac = S.duration ? Math.min(1, left / S.duration) : 0;
  $('#rtxt').textContent = Math.ceil(left);
  $('#rfg').style.strokeDashoffset = (125.66 * (1 - frac)).toFixed(2);
  $('#ring').classList.toggle('low', left <= 10);
}
setInterval(tickTimer, 250);

// ── tablar ─────────────────────────────────────────────────────────────
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + tab));
  if (tab === 'chat') { unread = 0; updDot(); const l = $('#chatlist'); l.scrollTop = l.scrollHeight; }
  if (S) renderBar();
  hap('l');
});
if (!gid) { fullMsg('🔗', 'Havola noto‘g‘ri', "Guruhdagi «Qo'shilish» tugmasi orqali kiring."); }
else poll();
})();
</script>
