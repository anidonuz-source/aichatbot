<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mafia — {{ bot_name }}</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&display=swap" rel="stylesheet">
{% raw %}
<style>
:root{--town:#3ddcb0;--mafia:#ff4d5a;--maniac:#ffb02e;--vamp:#b66bff;--ink:#f3f1ff;--mut:#a29fc2;--card:rgba(14,12,32,.74);--line:rgba(255,255,255,.12);--acc:#7c5cff;--ser:Georgia,'Times New Roman',serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#070505;color:var(--ink);font:14px/1.38 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
#app{position:fixed;left:0;right:0;top:0;height:var(--tvh,100%);display:flex;flex-direction:column;padding-top:var(--sat)}
/* osmon */
.sky{position:fixed;inset:0;opacity:0;transition:opacity 1.2s}
.s-lobby{background:linear-gradient(#17112f,#2c2152 70%,#3b2a63)}.s-night{background:linear-gradient(#04061a,#0d1636 55%,#1b2552)}
.s-day{background:linear-gradient(#5aa9ff,#9fd0ff 55%,#ffe2b0)}.s-vote{background:linear-gradient(#2a1233,#8a2b4a 55%,#ff8a4c)}.s-end{background:linear-gradient(#0e0a24,#2a1b52 60%,#4a2c6e)}
body.lobby .s-lobby,body.reveal .s-lobby,body.night .s-night,body.day .s-day,body.vote .s-vote,body.ended .s-end{opacity:1}
#stars{position:fixed;inset:0;opacity:0;transition:opacity 1.2s;background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 28% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 22%,#cfe,transparent),radial-gradient(1px 1px at 63% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 82% 26%,#fff,transparent),radial-gradient(1px 1px at 92% 9%,#fff,transparent),radial-gradient(1px 1px at 7% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 40%,#fff,transparent);animation:tw 4s infinite alternate}
body.night #stars,body.lobby #stars,body.reveal #stars,body.ended #stars{opacity:.9}
@keyframes tw{to{opacity:.45}}
#orb{position:fixed;width:54px;height:54px;border-radius:50%;left:78%;top:9%;transition:all 1.6s cubic-bezier(.4,0,.2,1);background:radial-gradient(circle at 35% 35%,#fffbe8,#f2e6b8 60%,#cdbb86);box-shadow:0 0 40px 12px rgba(255,248,210,.35)}
body.day #orb{left:18%;top:11%;background:radial-gradient(circle,#fff6b0,#ffd23f 65%);box-shadow:0 0 60px 24px rgba(255,210,63,.55)}
body.vote #orb{left:10%;top:27%;background:radial-gradient(circle,#ffd0a0,#ff6a3d 70%);box-shadow:0 0 70px 30px rgba(255,90,40,.5)}
#city{position:fixed;left:0;right:0;bottom:34vh;width:100%;height:20vh}
#city .w{animation:lt 5s infinite alternate}body.day #city .w{opacity:.15;animation:none}@keyframes lt{0%{opacity:.35}100%{opacity:1}}
.cloud{position:fixed;left:-30%;width:150px;height:44px;border-radius:44px;background:#fff;opacity:0;filter:blur(2px);animation:cl var(--d) linear infinite;box-shadow:40px -14px 0 8px #fff,85px 4px 0 -2px #fff}
body.day .cloud{opacity:.85}@keyframes cl{to{left:120%}}
.fog{position:fixed;left:-20%;right:-20%;bottom:30vh;height:26vh;opacity:0;background:radial-gradient(ellipse,rgba(180,190,255,.22),transparent 70%);animation:fg 16s ease-in-out infinite alternate;transition:opacity 1.5s}
body.night .fog,body.lobby .fog,body.ended .fog{opacity:1}@keyframes fg{to{transform:translateX(12%)}}
/* yuqori panel */
#top{position:relative;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;white-space:nowrap;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bar{flex:1;height:6px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden}
#bar i{display:block;height:100%;background:linear-gradient(90deg,var(--town),#fff);transform-origin:left;transition:transform .25s linear}
#bar.low i{background:var(--mafia)}
#me{cursor:pointer}
/* stol */
#stage{position:relative;z-index:3;flex:1;min-height:0}
#table{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:min(calc(100% - 8px),94vw);aspect-ratio:1}
#felt{position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle,rgba(40,30,80,.55),rgba(10,8,26,.62));border:1px solid var(--line);box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#center{position:absolute;inset:31%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:1}
#ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
#ring circle{fill:none;stroke-width:3}#ring .bg{stroke:rgba(255,255,255,.12)}#ring .fg{stroke:var(--town);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
#tnum{font:700 30px var(--ser)}#tnum.pulse{color:var(--mafia);animation:hb .5s infinite alternate}@keyframes hb{to{transform:scale(1.15)}}
#tlab{font-size:11px;color:var(--mut);max-width:92%}
.seat{position:absolute;width:var(--sz);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:3;cursor:pointer}
.av{position:relative;width:var(--sz);height:var(--sz);border-radius:50%;display:grid;place-items:center;font:700 calc(var(--sz)*.42) var(--ser);color:#fff;border:2px solid rgba(255,255,255,.35);box-shadow:0 4px 14px rgba(0,0,0,.4);transition:box-shadow .2s,border-color .2s}
.av:after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.32),transparent 55%)}
.seat.ok .av{animation:pl 1.4s infinite}@keyframes pl{50%{box-shadow:0 0 0 5px rgba(255,255,255,.24),0 4px 14px rgba(0,0,0,.45)}}
.seat.pend .av{border-color:#fff;border-style:dashed;box-shadow:0 0 0 4px rgba(255,255,255,.35);animation:none}
.seat.sel .av{border-color:#fff;box-shadow:0 0 0 4px var(--maniac),0 0 24px var(--maniac);animation:none}
.seat.me .av{border-color:var(--town)}
.seat.dead .av{filter:grayscale(1) brightness(.55)}.seat.dead:after{content:'💀';position:absolute;top:calc(var(--sz)*.16);left:50%;transform:translateX(-50%);font-size:calc(var(--sz)*.5)}
.nm{margin-top:3px;font-size:10.5px;font-weight:600;max-width:68px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 3px #000}
body.day .nm{text-shadow:0 1px 3px #000,0 0 6px rgba(0,0,0,.6)}
.rb{position:absolute;right:-6px;top:-6px;background:#15122e;border:1px solid var(--line);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px;z-index:1}
.vb{position:absolute;left:-6px;top:-6px;background:var(--maniac);color:#1a1200;border-radius:99px;min-width:19px;height:19px;padding:0 5px;font:700 11px/19px system-ui;text-align:center;z-index:1}
.bub{position:absolute;bottom:100%;margin-bottom:5px;left:50%;transform:translateX(-50%);width:max-content;max-width:104px;background:#fff;color:#16122e;border-radius:12px;padding:4px 8px;font-size:11px;font-weight:600;line-height:1.25;z-index:4;animation:bp .2s;pointer-events:none}
.bub:after{content:'';position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
@keyframes bp{from{transform:translateX(-50%) scale(.5);opacity:0}}
/* dock */
#dock{position:relative;z-index:6;height:40vh;max-height:340px;min-height:240px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:2px solid var(--line);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:var(--sab);transition:border-color .6s}
body.day #dock{background:rgba(18,16,44,.9)}
#dock.min{height:auto;min-height:0}#dock.min .pane,#dock.min #tabs{display:none!important}
#grip{width:56px;height:20px;display:grid;place-items:center;margin:0 auto;flex:none}#grip:before{content:'';width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.3)}
#tabs{display:flex;gap:4px;padding:0 10px}
#tabs button{flex:1;color:var(--mut);padding:8px 2px;border-radius:12px;font-weight:600;position:relative;font-size:13px}
#tabs button.on{background:rgba(255,255,255,.1);color:var(--ink)}
#tabs b{position:absolute;top:3px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--mafia);display:none}
.pane{display:none;flex:1;min-height:0;overflow:auto;padding:10px 14px;-webkit-overflow-scrolling:touch}
.pane.on{display:block}#p-chat.on{display:flex;flex-direction:column}
h3{margin:0 0 4px;font:700 17px var(--ser)}.mut{color:var(--mut);font-size:12.5px}
.btn{display:block;width:100%;background:linear-gradient(135deg,#7c5cff,#c14bff);padding:12px;border-radius:14px;font-weight:700;margin-top:8px;box-shadow:0 6px 18px rgba(124,92,255,.32);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}.btn.alt{background:rgba(255,255,255,.1);box-shadow:none}.btn.red{background:linear-gradient(135deg,#ff4d5a,#b3203f);box-shadow:0 6px 18px rgba(255,77,90,.3)}.btn.good{background:linear-gradient(135deg,#2fcf9f,#17996f);box-shadow:none}
.btn:disabled{opacity:.4;pointer-events:none}.row{display:flex;gap:8px}.row .btn{flex:1}
.note{background:rgba(255,255,255,.08);border-left:3px solid var(--maniac);border-radius:8px;padding:7px 10px;margin:6px 0;font-size:13px}
.note.ok{border-color:var(--town)}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.pl span{background:rgba(255,255,255,.1);border-radius:99px;padding:4px 10px;font-size:12.5px}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.m{display:flex;gap:7px;align-items:flex-end;max-width:88%}.m.me{align-self:flex-end;flex-direction:row-reverse}
.m .b{background:rgba(255,255,255,.1);padding:6px 10px;border-radius:14px 14px 14px 4px;overflow-wrap:anywhere}.m.me .b{background:rgba(124,92,255,.55);border-radius:14px 14px 4px 14px}
.m .a{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 11px var(--ser);color:#fff}
.m small{display:block;color:var(--mut);font-size:10.5px;font-weight:700}.m.mafia .b{border:1px solid var(--mafia)}.m.dead .b{opacity:.7;font-style:italic}
#chs{font-size:11.5px;color:var(--mut);padding-bottom:5px}
#qp{display:flex;gap:6px;overflow-x:auto;padding-top:6px;scrollbar-width:none}#qp::-webkit-scrollbar{display:none}
#qp button{flex:none;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12.5px}
#cf{display:flex;gap:6px;margin-top:8px}#cf input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--ink);font:inherit;outline:0}
#cf button{background:var(--acc);border-radius:14px;padding:0 16px;font-size:16px}#cf.off{opacity:.45;pointer-events:none}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}.tl div{position:relative;margin:0 0 9px}
.tl div:before{content:'';position:absolute;left:-18px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--mut)}
.tl .death:before,.tl .lynch:before{background:var(--mafia)}.tl .night:before{background:#6b7cff}.tl .vote:before{background:var(--maniac)}
.rl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rc{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px;border-top:3px solid var(--town)}
.rc.mafia{border-color:var(--mafia)}.rc.maniac{border-color:var(--maniac)}.rc.vampire{border-color:var(--vamp)}.rc.mine{outline:2px solid #fff}.rc b{display:block}.rc span{font-size:11.5px;color:var(--mut)}
/* overlay */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,3,16,.84);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px}.ov.on{display:flex}
#card{width:min(78vw,300px);aspect-ratio:3/4.2;perspective:900px;cursor:pointer}
#cin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}#card.flip #cin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.f1{background:repeating-linear-gradient(45deg,#2a1b52,#2a1b52 10px,#34226a 10px,#34226a 20px);border:2px solid var(--acc);font:700 22px var(--ser)}
.f2{transform:rotateY(180deg);background:linear-gradient(160deg,#1c1744,#0e0b26);border:2px solid var(--c,var(--town));box-shadow:0 0 40px var(--c,var(--town))}
.f2 .em{font-size:72px;filter:drop-shadow(0 0 18px var(--c))}.f2 h2{margin:4px 0;font:700 28px var(--ser)}.f2 .tm{color:var(--c);font-weight:700;letter-spacing:1.5px;font-size:12px}
#ovd{background:radial-gradient(circle,rgba(90,0,20,.88),rgba(5,0,8,.96))}.big{font:700 34px var(--ser);margin:6px 0}
#pbox,#endbox,#deadbox{width:min(88vw,340px);text-align:center}
#pbox{background:linear-gradient(160deg,#1c1744,#0e0b26);border:1px solid var(--line);border-radius:22px;padding:20px 16px;animation:bp2 .25s}@keyframes bp2{from{transform:scale(.88);opacity:0}}
#pbox .av{width:72px;height:72px;font-size:30px;margin:0 auto 8px}
.st{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}.st span{background:rgba(255,255,255,.09);border-radius:99px;padding:4px 11px;font-size:12.5px}
.pm{background:rgba(255,255,255,.07);border-radius:10px;padding:6px 10px;margin-top:5px;text-align:left;font-size:12.5px}
.sum{max-height:38vh;overflow:auto;text-align:left;width:100%;margin-top:10px}.sum div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
#ann{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;pointer-events:none}
#ann.on{display:flex;animation:an 2.2s forwards}#ann div{font:700 clamp(34px,11vw,56px) var(--ser);text-shadow:0 0 30px #000,0 4px 12px #000;text-align:center;letter-spacing:2px}
@keyframes an{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
#toasts{position:fixed;top:calc(52px + var(--sat));left:12px;right:12px;z-index:25;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.t{background:rgba(20,16,44,.94);border:1px solid var(--line);border-left:4px solid var(--maniac);border-radius:12px;padding:9px 12px;animation:ti .3s,to .4s 3.8s forwards}.t.bad{border-left-color:var(--mafia)}
@keyframes ti{from{transform:translateY(-12px);opacity:0}}@keyframes to{to{opacity:0;transform:translateY(-8px)}}
.cf{position:fixed;top:-30px;z-index:40;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#2a1b52,#07050f);display:grid;place-items:center;text-align:center;transition:opacity .8s,visibility .8s}
#splash.off{opacity:0;visibility:hidden}#splash .lg{font-size:76px;animation:fl 2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-10px) rotate(-6deg)}}
#splash h1{margin:6px 0;font:700 40px var(--ser);letter-spacing:10px}
.full{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;padding:30px;background:#070505}.full h2{font:700 24px var(--ser);margin:8px 0}
#tabs button{font-size:12px}
#rx{position:relative;z-index:6;display:none;gap:6px;justify-content:center;padding:4px 8px;flex-wrap:wrap}#rx.on{display:flex}
#rx button{font-size:20px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 9px;line-height:1.5}#rx button:active{transform:scale(.88)}
.fl{position:absolute;font-size:28px;pointer-events:none;z-index:8;animation:flt 2.4s ease-out forwards}
@keyframes flt{from{transform:translate(-50%,-30%) scale(.6);opacity:0}15%{opacity:1}to{transform:translate(-50%,-190%) scale(1.25);opacity:0}}
.afk{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);font-size:11px}
.set{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px;margin:8px 0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}.srow>div{display:flex;align-items:center;gap:10px}
.sb{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);font-weight:700;font-size:16px}
.sws{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sw,.sws span{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:12.5px}
.sw.on{background:rgba(61,220,176,.2);border-color:var(--town)}
.lr{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}.lr.me{color:var(--town);font-weight:700}
.ach{display:inline-block;background:rgba(255,255,255,.1);border-radius:99px;padding:3px 10px;margin:3px 4px 0 0;font-size:12.5px}.ach.lock{opacity:.35}
.m.last .b{border:1px solid var(--maniac)}
.seat{padding:0}.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.mk{position:absolute;right:-6px;bottom:-4px;font-size:13px;z-index:1}
.mkrow{display:flex;gap:6px;justify-content:center;margin:8px 0}
.mkin{width:100%;background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--ink);font:inherit;outline:0}
html.kb #stage,html.kb #rx{display:none}html.kb #dock{height:auto;max-height:none;flex:1}
#tabs{overflow-x:auto;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}#tabs button{flex:none;padding:8px 11px}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px;margin:6px 0}
.it small{display:block;color:var(--mut)}.it .btn{width:auto;margin:0;padding:8px 12px;flex:none}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01s!important}}

/* ===== NOIR ===== */
:root{--town:#e0bd62;--mafia:#c1272d;--maniac:#d9822b;--vamp:#9a6bb5;--ink:#e9e1d0;--mut:#948b7b;--card:rgba(12,8,8,.8);--line:rgba(201,168,76,.25);--acc:#a3202c;--ser:'Bebas Neue',Impact,'Arial Narrow',sans-serif;--tw:'Special Elite','Courier New',monospace}
html,body{background:#070505;color:var(--ink)}
.s-lobby{background:linear-gradient(#0d0809,#1c0e10 70%,#2a1416)}.s-night{background:linear-gradient(#030406,#0a0e14 55%,#151c26)}
.s-day{background:linear-gradient(#2c2f33,#53575b 55%,#7b7566)}.s-vote{background:linear-gradient(#12050a,#52101a 60%,#8a2a1c)}.s-end{background:linear-gradient(#050304,#16090b 60%,#2a1315)}
#orb{background:radial-gradient(circle at 35% 35%,#d9dbd8,#9ea3a3 60%,#6c7070);box-shadow:0 0 30px 8px rgba(190,200,210,.18)}
body.day #orb{background:radial-gradient(circle,#d8d2bc,#a9a38c 70%);box-shadow:0 0 50px 20px rgba(200,195,170,.25);opacity:.45}
body.vote #orb{background:radial-gradient(circle,#e0a070,#a03a22 70%);box-shadow:0 0 60px 24px rgba(160,40,20,.4)}
.cloud{background:#3b3e42;box-shadow:40px -14px 0 8px #3b3e42,85px 4px 0 -2px #3b3e42;filter:blur(5px)}body.day .cloud{opacity:.9}
#city rect:first-child{fill:#030203}#city{filter:drop-shadow(0 -2px 10px rgba(0,0,0,.6))}
.chip{border-radius:3px;font-family:var(--tw);letter-spacing:.5px;border-color:var(--line)}
.btn{background:linear-gradient(#a3202c,#661018)!important;border:1px solid #c9a84c!important;border-radius:3px!important;font-family:var(--tw);text-transform:uppercase;letter-spacing:1px;color:#f3e6c4!important}.btn.alt{background:rgba(0,0,0,.4)!important;color:#e0bd62!important}
.av{border-color:rgba(224,189,98,.55)!important;filter:saturate(.7) contrast(1.05)}

}

  if (e.status === 404) return fatal('🕳', "O'yin topilmadi", "O'yin tugagan yoki havola eskirgan. Guruhda /mafia deb yangisini oching.");

}

const nb=d=>{const b=A.createBuffer(1,A.sampleRate*d,A.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b};
function bu(t,f,d,g,ty){const s=A.createBufferSource(),k=A.createBiquadFilter(),v=A.createGain(),n=A.currentTime+t;s.buffer=nb(d);k.type=ty||'lowpass';k.frequency.value=f;v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(k);k.connect(v);v.connect(A.destination);s.start(n)}
function to(t,f,d,g,ty){const o=A.createOscillator(),v=A.createGain(),n=A.currentTime+t;o.type=ty||'sine';o.frequency.value=f;v.gain.setValueAtTime(g,n);v.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(v);v.connect(A.destination);o.start(n);o.stop(n+d+.05)}
const S={step:()=>[0,.55,1.1,1.65].forEach(t=>bu(t,260,.14,.5)),tick:()=>{bu(0,3500,.025,.3,'highpass');to(0,900,.04,.04,'square')},gavel:()=>{[0,.3].forEach(t=>{bu(t,1100,.09,.8);to(t,120,.35,.6)})},hit:()=>{to(0,55,1.6,.6);to(0,82,1.3,.25,'sawtooth');bu(0,220,.6,.6)},thunder:()=>bu(0,150,2.4,.9),win:()=>{to(0,196,1.2,.3,'triangle');to(.25,247,1.2,.3,'triangle');to(.5,294,1.8,.3,'triangle')}};
const pl=k=>{if(!on())return;try{ac();S[k]()}catch(e){}};
addEventListener('pointerdown',()=>{if(go||!on())return;try{ac();go=1;const s=A.createBufferSource();rg=A.createGain();rg.gain.value=0;const f=A.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.4;s.buffer=nb(3);s.loop=true;s.connect(f);f.connect(rg);rg.connect(A.destination);s.start()}catch(e){}},{once:true,capture:true});
setInterval(()=>{if(rg)rg.gain.setTargetAtTime(on()?({night:.09,vote:.06,day:.04,lobby:.03}[ph()]||.02):0,A.currentTime,.5)},700);
/* diktor */
const RU=localStorage.getItem('mf_lang')==='ru',TX={night:["Shahar uyquga ketdi… Mafiya uyg'onadi.","Город засыпает… Мафия просыпается."],day:["Shahar uyg'ondi…","Город просыпается…"],vote:["Hukm vaqti keldi.","Время приговора."],reveal:["Rollar taqsimlandi. Hech kimga ishonma.","Роли розданы. Никому не верь."],ended:["Pardalar yopildi.","Занавес закрыт."]};
let tm,ti;function say(k){const x=TX[k];if(!x)return;const t=x[RU?1:0];clearInterval(ti);clearTimeout(tm);nar.textContent='';nar.classList.add('on');let i=0;ti=setInterval(()=>{nar.textContent=t.slice(0,++i);if(i>=t.length){clearInterval(ti);tm=setTimeout(()=>nar.classList.remove('on'),3200)}},42)}
let cur=ph();say(cur==='lobby'?'':cur);
new MutationObserver(()=>{const p=ph();if(p===cur)return;cur=p;say(p);if(p==='night')pl('step');if(p==='vote')pl('gavel');if(p==='ended')pl('win')}).observe(B,{attributes:1,attributeFilter:['class']});
setInterval(()=>{if(B.classList.contains('night')&&Math.random()<.35){fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on');setTimeout(()=>pl('thunder'),700+Math.random()*900)}},8000);
new MutationObserver(()=>{const t=document.getElementById('tnum');if(t&&t.classList.contains('pulse'))pl('tick')}).observe(document.getElementById('tnum'),{childList:1,characterData:1,subtree:1});
new MutationObserver(()=>{if(document.getElementById('ovr').classList.contains('on'))pl('hit')}).observe(document.getElementById('ovr'),{attributes:1,attributeFilter:['class']});
const eb=document.getElementById('endbox');new MutationObserver(()=>{if(!document.getElementById('ove').classList.contains('on')||eb.querySelector('.np'))return;const m=eb.querySelector('.mut'),b=eb.querySelector('.big');if(!m||!b||!/G'OLIB|ПОБЕД/i.test(m.textContent))return;const h=document.createElement('div');h.className='np';h.innerHTML=`<b>MAFIA TIMES</b><i>${new Date().toLocaleDateString()}</i><h3>${RU?'Экстренный выпуск':'Maxsus son'}: ${b.textContent}</h3>`;eb.prepend(h);pl('hit')}).observe(document.getElementById('ove'),{attributes:1,attributeFilter:['class']});

const T=window.Telegram&&Telegram.WebApp;
if(T&&T.requestFullscreen&&T.isVersionAtLeast&&T.isVersionAtLeast('8.0')&&!/^(android|ios)$/.test(T.platform||'')){
const b=document.createElement('button');b.className='chip';b.id='fsb';b.setAttribute('aria-label','Fullscreen');b.innerHTML=P('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>');document.getElementById('snd').before(b);
b.onclick=()=>{try{T.isFullscreen?T.exitFullscreen():T.requestFullscreen()}catch(e){}};
const ins=()=>{const a=(T.safeAreaInset||{}).top||0,c=(T.contentSafeAreaInset||{}).top||0;document.documentElement.style.setProperty('--sat',T.isFullscreen&&a+c>0?(a+c)+'px':'')};
['fullscreenChanged','safeAreaChanged','contentSafeAreaChanged'].forEach(e=>T.onEvent(e,ins));
try{T.requestFullscreen()}catch(e){}}

const kf=()=>{const e=document.getElementById('table');e&&document.documentElement.style.setProperty('--k',Math.min(1.9,Math.max(1,e.offsetWidth/360)).toFixed(2))};kf();addEventListener('resize',kf);window.ResizeObserver&&new ResizeObserver(kf).observe(document.getElementById('table'));
})();</script>
